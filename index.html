<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vehicle Repair Center - Complete System</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --success: #059669;
            --success-light: #d1fae5;
            --warning: #d97706;
            --warning-light: #fef3c7;
            --danger: #dc2626;
            --danger-light: #fee2e2;
            --info: #0891b2;
            --info-light: #cffafe;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --white: #ffffff;
            --sidebar-width: 280px;
            --header-height: 60px;
            --border-radius: 12px;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Noto Sans Lao', sans-serif;
            background: var(--gray-100);
            color: var(--gray-800);
            font-size: 14px;
        }

        /* Login Page - Same as before */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 20px;
        }

        .login-box {
            background: var(--white);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header { text-align: center; margin-bottom: 32px; }
        .login-header .logo {
            width: 80px;
            height: 80px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .login-header .logo i { font-size: 36px; color: var(--primary); }
        .login-header h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
        .login-header .subtitle { font-size: 0.875rem; color: var(--gray-500); }

        .login-form .form-group { margin-bottom: 20px; }
        .login-form label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 0.875rem; color: var(--gray-700); }
        .login-form label i { margin-right: 6px; color: var(--primary); }
        .login-form input, .login-form select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--gray-200);
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.9375rem;
        }
        .login-form input:focus, .login-form select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-login:hover { background: var(--primary-dark); }

        .error-message {
            color: var(--danger);
            font-size: 0.875rem;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
        .error-message.show { display: block; }

        /* App Layout */
        .app-container { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: var(--sidebar-width);
            background: var(--white);
            border-right: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: all 0.3s ease;
        }
        .sidebar.collapsed { width: 70px; }
        
        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            gap: 12px;
            height: var(--header-height);
        }
        .logo-small {
            width: 36px;
            height: 36px;
            background: var(--primary-light);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-small i { color: var(--primary); font-size: 1.125rem; }
        .brand-name { font-weight: 700; font-size: 1.125rem; color: var(--gray-800); }
        .sidebar.collapsed .brand-name { display: none; }
        
        .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
        .sidebar-nav ul { list-style: none; }
        .sidebar-nav li { margin-bottom: 4px; }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--border-radius);
            color: var(--gray-600);
            text-decoration: none;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
        }
        .sidebar-nav a:hover { background: var(--gray-100); color: var(--primary); }
        .sidebar-nav a.active { background: var(--primary-light); color: var(--primary); }
        .sidebar.collapsed .sidebar-nav a span { display: none; }
        
        .sidebar-footer { padding: 16px; border-top: 1px solid var(--gray-200); }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-avatar i { font-size: 1.25rem; color: var(--primary); }
        .user-name { font-weight: 600; font-size: 0.875rem; color: var(--gray-800); }
        .user-role { font-size: 0.75rem; color: var(--gray-500); }
        .sidebar.collapsed .user-details { display: none; }
        
        .btn-logout {
            width: 100%;
            padding: 10px;
            background: var(--danger-light);
            color: var(--danger);
            border: none;
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-logout:hover { background: var(--danger); color: var(--white); }
        
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        .sidebar.collapsed + .main-content { margin-left: 70px; }
        
        .top-bar {
            height: var(--header-height);
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .menu-toggle {
            background: none;
            border: none;
            color: var(--gray-600);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 8px;
            border-radius: var(--border-radius);
        }
        .page-title { margin-left: 16px; flex: 1; }
        .page-title h2 { font-size: 1.25rem; font-weight: 600; }
        
        .top-actions { display: flex; align-items: center; gap: 16px; }
        .notification-bell { position: relative; cursor: pointer; }
        .notification-bell .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
        }
        .current-time { font-size: 0.875rem; color: var(--gray-500); }
        
        .content-area { padding: 24px; }

        /* Dashboard Cards */
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--white);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card.success { border-left-color: var(--success); }
        .stat-card.warning { border-left-color: var(--warning); }
        .stat-card.info { border-left-color: var(--info); }
        .stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .stat-label { font-size: 0.875rem; color: var(--gray-500); }
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-light);
            color: var(--primary);
        }
        .stat-value { font-size: 1.75rem; font-weight: 700; }

        /* Tables */
        .data-table-container {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }
        .table-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            min-width: 600px;
        }
        .table-title { font-size: 1.125rem; font-weight: 600; }
        .table-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }
        .data-table th, .data-table td {
            padding: 12px 16px;
            text-align: left;
            font-size: 0.875rem;
            border-bottom: 1px solid var(--gray-200);
        }
        .data-table th {
            background: var(--gray-100);
            font-weight: 600;
            color: var(--gray-600);
            position: sticky;
            top: 0;
        }
        .data-table tbody tr:hover { background: var(--gray-50); }
        
        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            border-top: 1px solid var(--gray-200);
        }
        .pagination button {
            padding: 6px 12px;
            border: 1px solid var(--gray-300);
            background: white;
            border-radius: 6px;
            cursor: pointer;
        }
        .pagination button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
        .status-pending { background: var(--warning-light); color: var(--warning); }
        .status-pending::before { background: var(--warning); }
        .status-approved { background: var(--success-light); color: var(--success); }
        .status-approved::before { background: var(--success); }
        .status-progress { background: var(--info-light); color: var(--info); }
        .status-progress::before { background: var(--info); }
        .status-completed { background: var(--primary-light); color: var(--primary); }
        .status-completed::before { background: var(--primary); }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--primary); color: var(--white); }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: var(--white); }
        .btn-success:hover { background: #047857; }
        .btn-warning { background: var(--warning); color: var(--white); }
        .btn-danger { background: var(--danger); color: var(--white); }
        .btn-secondary { background: var(--gray-300); color: var(--gray-700); }
        .btn-outline { background: transparent; border: 1px solid var(--gray-400); color: var(--gray-700); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .btn-sm { padding: 4px 12px; font-size: 0.75rem; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--white);
            border-radius: 12px;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content.modal-lg { max-width: 900px; }
        .modal-content.modal-xl { max-width: 1100px; }
        .modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }
        .modal-header h3 { font-size: 1.125rem; font-weight: 600; }
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--gray-400);
            cursor: pointer;
        }
        .close-btn:hover { color: var(--danger); }
        .modal-body { padding: 24px; }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--gray-200);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            position: sticky;
            bottom: 0;
            background: white;
        }

        /* Forms */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 0.875rem; }
        .form-group .required { color: var(--danger); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-300);
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.875rem;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* Search Input */
        .search-input {
            padding: 8px 12px;
            border: 1px solid var(--gray-300);
            border-radius: 20px;
            width: 250px;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            animation: slideInRight 0.3s ease;
            border-left: 4px solid var(--primary);
        }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast.warning { border-left-color: var(--warning); }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .toast-icon { font-size: 1.25rem; }
        .toast.success .toast-icon { color: var(--success); }
        .toast.error .toast-icon { color: var(--danger); }
        .toast-content { flex: 1; }
        .toast-title { font-weight: 600; font-size: 0.875rem; }
        .toast-message { font-size: 0.75rem; color: var(--gray-500); }

        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state-icon {
            width: 80px;
            height: 80px;
            background: var(--gray-100);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .empty-state-icon i { font-size: 2rem; color: var(--gray-400); }
        .currency { font-weight: 600; }
        .currency::after { content: ' ₭'; }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .loading-overlay.show { display: flex; }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--gray-300);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Print Styles */
        @media print {
            .sidebar, .top-bar, .btn, .modal-footer, .no-print { display: none !important; }
            .modal { position: relative; display: block !important; background: white; }
            .modal-content { max-width: 100%; margin: 0; padding: 0; box-shadow: none; }
            body { background: white; }
            .main-content { margin: 0; padding: 0; }
        }

        /* Receipt Styles */
        .receipt {
            max-width: 350px;
            margin: 0 auto;
            font-family: monospace;
            font-size: 12px;
        }
        .receipt-header { text-align: center; border-bottom: 1px dashed #000; padding-bottom: 10px; margin-bottom: 10px; }
        .receipt-item { display: flex; justify-content: space-between; margin: 5px 0; }
        .receipt-total { border-top: 1px dashed #000; padding-top: 10px; margin-top: 10px; font-weight: bold; }
        .receipt-footer { text-align: center; border-top: 1px dashed #000; padding-top: 10px; margin-top: 10px; font-size: 10px; }

        /* File Upload */
        .file-upload-area {
            border: 2px dashed var(--gray-300);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .file-upload-area:hover { border-color: var(--primary); background: var(--primary-light); }

        /* QR Code Container */
        .qr-code-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: white;
        }
        #qrcode canvas, #qrcode img { width: 200px !important; height: 200px !important; }

        /* Report Styles */
        .report-filters {
            display: flex;
            gap: 16px;
            padding: 16px 24px;
            background: var(--gray-50);
            border-bottom: 1px solid var(--gray-200);
            flex-wrap: wrap;
        }
        .report-filters input, .report-filters select {
            padding: 8px 12px;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
        }
        .report-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            padding: 16px 24px;
            background: var(--primary-light);
        }
        .report-summary-item {
            text-align: center;
        }
        .report-summary-item .label { font-size: 0.75rem; color: var(--gray-600); }
        .report-summary-item .value { font-size: 1.25rem; font-weight: 700; color: var(--primary); }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); position: fixed; }
            .sidebar.show { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .dashboard-stats { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .search-input { width: 100%; }
            .modal-content { max-width: 95%; }
            .table-actions { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <!-- LOGIN PAGE -->
    <div id="login-page" class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo"><i class="fas fa-car-crash"></i></div>
                <h1>ລະບົບຈັດການສູນສ້ອມແປງຍານພາຫະນະ</h1>
                <p class="subtitle">Vehicle Repair Center Management System</p>
            </div>
            <div class="login-form">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> ອີເມວ</label>
                    <input type="email" id="email" placeholder="somchai@test.com" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> ລະຫັດຜ່ານ</label>
                    <input type="password" id="password" placeholder="123456" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user-tag"></i> ຕຳແໜ່ງ</label>
                    <select id="role" required>
                        <option value="">ເລືອກຕຳແໜ່ງ</option>
                        <option value="reception">ຝ່າຍຕ້ອນຮັບ</option>
                        <option value="mechanic">ຊ່າງສ້ອມແປງ</option>
                        <option value="warehouse">ຝ່າຍສາງ</option>
                        <option value="pdi">ຝ່າຍກວດກາ PDI</option>

        function parseQRCode(qrData) {
            const parts = qrData.split(':');

                return { type: 'part', id: parts[1], code: parts[2] };
            }
            if (parts[0] === 'RCP' || qrData.startsWith('RCP')) {
                return { type: 'receipt', number: qrData };
            }
            if (parts[0] === 'JC') {
                return { type: 'jobcard', number: qrData };
            }
            return null;

        async function startQRScanner(onSuccess, onError) {
            const qrReader = document.getElementById('qr-reader');

            qrReader.innerHTML = '';

            try {
                await html5QrCode.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText) => { stopQRScanner(); if (onSuccess) onSuccess(decodedText); },
                    (error) => { console.log('Scan error:', error); }
                );
            } catch (err) { if (onError) onError(err); }
        }

                    .eq('part_id', partId)
                    .in('status', ['approved'])
                    .order('approved_at', { ascending: false })
                    .limit(limit);
                return { data, error };
            },
            async bulkCreateParts(partsArray) {
                const { data, error } = await initSupabase().from('parts').insert(partsArray).select();
                return { data, error };
            },
            async createTransaction(transaction) {
                const { data, error } = await initSupabase().from('transactions').insert([transaction]).select().single();
                return { data, error };
            },
            async getTransactions(jobId) {
                const { data, error } = await initSupabase().from('transactions').select('*').eq('job_card_id', jobId).order('created_at', { ascending: false });
                return { data, error };
            },
            async getTransactionByReceiptNumber(receiptNumber) {
                const { data, error } = await initSupabase().from('transactions').select('*, job_cards:job_card_id(*, vehicles(*, customers(*)), parts:job_parts(*, part:part_id(*)), labor:job_labor(*))').eq('receipt_number', receiptNumber).single();
                return { data, error };
            },
            async getFinancialReports(startDate, endDate) {
                let query = initSupabase().from('transactions').select('*, job_cards:job_card_id(*)').eq('status', 'paid');
                if (startDate) query = query.gte('created_at', startDate);
                if (endDate) query = query.lte('created_at', endDate);
                const { data, error } = await query.order('created_at', { ascending: false });
                return { data, error };
            },
            async getInventoryReport() {
                const { data, error } = await initSupabase().from('parts').select('*').order('code');
                return { data, error };
            },
            async getCustomerReport() {
                const { data, error } = await initSupabase()
                    .from('customers')
                    .select('*, vehicles(*), job_cards:vehicles(job_cards(*))')
                    .order('created_at', { ascending: false });
                return { data, error };
            }
        };

        async function showScanPage() {
            const content = document.getElementById('content-area');
            content.innerHTML = `
                <div class="data-table-container">
                    <div class="table-header">
                        <h3 class="table-title"><i class="fas fa-qrcode"></i> ສະແກນ QR Code</h3>

                        <div style="margin-top: 20px;">

                        </div>
                    </div>
                </div>
            `;
            
            // Start scanner
            const qrReader = document.getElementById('scan-qr-reader');
            if (qrReader) {
                const html5QrCode = new Html5Qrcode('scan-qr-reader');
                try {
                    await html5QrCode.start(
                        { facingMode: 'environment' },
                        { fps: 10, qrbox: { width: 300, height: 300 } },
                        async (decodedText) => {
                            await html5QrCode.stop();
                            const result = parseQRCode(decodedText);
                            if (result) {
                                document.getElementById('scan-result').innerHTML = `<div style="background: var(--success-light); color: var(--success); padding: 12px; border-radius: 8px;"><i class="fas fa-check-circle"></i> ພົບຂໍ້ມູນ!<br>${decodedText}</div>`;
                                if (result.type === 'receipt') {
                                    await searchByReceiptNumber(decodedText);
                                } else if (result.type === 'jobcard') {
                                    await searchByJobNumber(decodedText);
                                } else if (result.type === 'part') {
                                    showToast('info', 'ພົບອາໄຫຼ່', `ລະຫັດ: ${result.code}`);
                                }
                            } else {
                                document.getElementById('scan-result').innerHTML = `<div style="background: var(--danger-light); color: var(--danger); padding: 12px; border-radius: 8px;"><i class="fas fa-exclamation-circle"></i> QR Code ບໍ່ຖືກຕ້ອງ</div>`;
                            }
                        },
                        (error) => { console.log('Scan error:', error); }
                    );
                } catch (err) {
                    document.getElementById('scan-result').innerHTML = `<div style="background: var(--danger-light); color: var(--danger); padding: 12px; border-radius: 8px;"><i class="fas fa-exclamation-circle"></i> ບໍ່ສາມາດເປີດກ້ອງໄດ້</div>`;
                }
            }
        }

        function renderPartsTableWithPagination(parts, currentPage, perPage, isAdmin = false) {
            if (!parts || parts.length === 0) return `<div class="empty-state"><div class="empty-state-icon"><i class="fas fa-boxes"></i></div><h3>ບໍ່ມີຂໍ້ມູນອາໄຫຼ່</h3></div>`;
            
            const start = (currentPage - 1) * perPage;
            const end = start + perPage;
            const paginatedParts = parts.slice(start, end);
            const totalPages = Math.ceil(parts.length / perPage);
            
            return `
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr><th>QR</th><th>ລະຫັດ</th><th>ຊື່</th><th>ປະເພດ</th><th>ຈຳນວນ</th><th>ລາຄາ</th><th>ສະຖານະ</th><th>ປະຫວັດ</th>${isAdmin ? '<th>ຈັດການ</th>' : ''}</td>
                        </thead>
                        <tbody>
                            ${paginatedParts.map(p => `
                                <tr>
                                    <td><i class="fas fa-qrcode" style="color: var(--primary); cursor: pointer; font-size: 1.2rem;" onclick="showPartQR('${p.id}', '${p.code}')"></i></td
                                    <td><code>${p.code}</code></td
                                    <td><strong>${p.name}</strong></td
                                    <td>${p.category || '-'}</td
                                    <td style="${p.stock_quantity < 10 ? 'color: var(--danger); font-weight: bold;' : ''}">${p.stock_quantity}</td
                                    <td class="currency">${formatCurrency(p.price)}</td
                                    <td>${p.stock_quantity < 5 ? '<span class="status-badge status-warning">ໃກ້ຫມົດ</span>' : '<span class="status-badge status-approved">ມີສາງ</span>'}</td
                                    <td><button class="btn btn-info btn-sm" onclick="showInventoryMovement('${p.id}')" title="ປະຫວັດການເຄື່ອນໄຫວ"><i class="fas fa-chart-line"></i></button></td
                                    ${isAdmin ? `<td>
                                        <button class="btn btn-outline btn-sm" onclick="editPart('${p.id}')" title="ແກ້ໄຂ"><i class="fas fa-edit"></i></button>
                                        <button class="btn btn-danger btn-sm" onclick="deletePart('${p.id}')" title="ລຶບ"><i class="fas fa-trash"></i></button>
                                    </td` : ''}
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <button onclick="changePartPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>
                    <span style="padding: 6px 12px;">ໜ້າ ${currentPage} / ${totalPages}</span>
                    <button onclick="changePartPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>
                </div>
            `;
        }

        window.loadCustomerVehicles = async function(customerId) {
            if (!customerId) return;
            const { data: vehicles } = await DB.getVehiclesByCustomer(customerId);
            const select = document.getElementById('job_vehicle_id');
            select.innerHTML = '<option value="">ເລືອກຍານພາຫະນະ</option>';
            if (vehicles?.length) {
                vehicles.forEach(v => select.innerHTML += `<option value="${v.id}">${v.brand} ${v.model} (${v.license_plate})</option>`);
            } else {
                select.innerHTML += '<option value="" disabled>ບໍ່ມີຍານພາຫະນະ (ກະລຸນາເພີ່ມກ່ອນ)</option>';
            }
        };

        window.saveJobCard = async function() {
            const vehicleId = document.getElementById('job_vehicle_id')?.value;
            const mechanicId = document.getElementById('job_mechanic_id')?.value;
            const problem = document.getElementById('job_problem')?.value;
            if (!vehicleId) { showToast('warning', 'ແຈ້ງເຕືອນ', 'ກະລຸນາເລືອກຍານພາຫະນະ'); return; }
            if (!mechanicId) { showToast('warning', 'ແຈ້ງເຕືອນ', 'ກະລຸນາເລືອກຊ່າງ'); return; }
            if (!problem) { showToast('warning', 'ແຈ້ງເຕືອນ', 'ກະລຸນາປ້ອນບັນຫາທີ່ແຈ້ງ'); return; }
            showLoading();
            try {
                const jobCard = { 
                    job_number: generateJobNumber(), 
                    vehicle_id: vehicleId, 
                    mechanic_id: mechanicId, 
                    problem_description: problem, 
                    mileage_in: parseInt(document.getElementById('job_mileage')?.value) || null, 
                    notes: document.getElementById('job_notes')?.value || null, 
                    status: 'assigned', 
                    created_by: currentUser.id 
                };
                const { data, error } = await DB.createJobCard(jobCard);
                if (error) throw error;
                await DB.createNotification({ 
                    user_id: mechanicId, 
                    title: 'ມີງານໃໝ່', 
                    message: `ທ່ານໄດ້ຮັບມອບໝາຍງານ ${data.job_number}`, 
                    type: 'job_assigned' 
                });
                hideLoading();
                document.querySelector('.modal.show')?.remove();
                showToast('success', 'ສຳເລັດ', `ເປີດໃບສັ່ງງານ ${data.job_number} ສຳເລັດ`);
                await loadJobCards();
            } catch (error) { 
                hideLoading(); 
                showToast('error', 'ຜິດພາດ', error.message); 
            }
        };

        window.scanPartForJob = function(jobId) {
            showQRScannerModal('ສະແກນ QR ອາໄຫຼ່', async (scannedData) => {
                const result = parseQRCode(scannedData);
                let partId = null;
                if (result && result.type === 'part') {
                    partId = result.id;
                } else {
                    const { data: part } = await DB.getPartByCode(scannedData);
                    if (part) partId = part.id;
                }
                if (partId) {
                    await addPartToJob(jobId, partId, 1);
                } else {
                    showToast('error', 'ບໍ່ພົບ', 'ບໍ່ພົບອາໄຫຼ່ນີ້ໃນລະບົບ');
                }
            });
        };

        window.manualSelectPart = async function(jobId) {
            const { data: parts } = await DB.getParts();
            const partOptions = parts.map(p => `${p.code} - ${p.name} (${formatCurrency(p.price)})`).join('\n');
            const code = prompt(`ເລືອກອາໄຫຼ່ (ປ້ອນລະຫັດ):\n\nລາຍການອາໄຫຼ່:\n${partOptions}`);
            if (code) {
                const { data: part } = await DB.getPartByCode(code);
                if (part) {
                    await addPartToJob(jobId, part.id, 1);
                } else {
                    showToast('error', 'ບໍ່ພົບ', 'ບໍ່ພົບລະຫັດອາໄຫຼ່ນີ້');
                }
            }
        };

        async function addPartToJob(jobId, partId, quantity) {
            showLoading();
            try {
                const { data: existing } = await initSupabase().from('job_parts').select('*').eq('job_card_id', jobId).eq('part_id', partId).single();
                if (existing) {
                    await DB.updateJobPartQuantity(existing.id, existing.quantity + quantity);
                } else {
                    await DB.addJobPart({ 
                        job_card_id: jobId, 
                        part_id: partId, 
                        quantity: quantity, 
                        status: 'requested', 
                        requested_by: currentUser.id 
                    });
                }
                await DB.updateJobCard(jobId, { status: 'parts_requested' });
                const { data: updatedParts } = await DB.getJobParts(jobId);
                document.getElementById('selected-parts-list').innerHTML = renderSelectedParts(updatedParts || [], jobId);
                hideLoading();
                showToast('success', 'ສຳເລັດ', 'ເພີ່ມອາໄຫຼ່ເຂົ້າໃນຄຳຂໍແລ້ວ');
            } catch (error) { 
                hideLoading(); 
                showToast('error', 'ຜິດພາດ', error.message); 
            }
        }

        window.updatePartQty = async function(partJobId, change, jobId) {
            try {
                const { data: current } = await initSupabase().from('job_parts').select('*').eq('id', partJobId).single();
                const newQty = current.quantity + change;
                if (newQty < 1) { 
                    await removePart(partJobId, jobId); 
                    return; 
                }
                await DB.updateJobPartQuantity(partJobId, newQty);
                const { data: updatedParts } = await DB.getJobParts(jobId);
                document.getElementById('selected-parts-list').innerHTML = renderSelectedParts(updatedParts || [], jobId);
            } catch (error) { 
                showToast('error', 'ຜິດພາດ', error.message); 
            }
        };

        window.removePart = async function(partJobId, jobId) {
            try {
                await DB.deleteJobPart(partJobId);
                const { data: updatedParts } = await DB.getJobParts(jobId);
                document.getElementById('selected-parts-list').innerHTML = renderSelectedParts(updatedParts || [], jobId);
                showToast('success', 'ສຳເລັດ', 'ລຶບອາໄຫຼ່ອອກແລ້ວ');

                showToast('error', 'ຜິດພາດ', error.message); 
            }
        };

        window.saveLabor = async function(jobId) {
            const desc = document.getElementById('labor_desc')?.value;
            const type = document.getElementById('labor_type')?.value;
            const hours = parseFloat(document.getElementById('labor_hours')?.value);
            if (!desc) { showToast('warning', 'ແຈ້ງເຕືອນ', 'ກະລຸນາປ້ອນລາຍລະອຽດງານ'); return; }
            if (!hours || hours <= 0) { showToast('warning', 'ແຈ້ງເຕືອນ', 'ກະລຸນາປ້ອນຈຳນວນຊົ່ວໂມງ'); return; }
            const rate = LABOR_RATES[type] || 50000;
            const cost = rate * hours;
            showLoading();

                await DB.addJobLabor({ 
                    job_card_id: jobId, 
                    description: desc, 
                    labor_type: type, 
                    hours: hours, 
                    hourly_rate: rate, 
                    cost: cost

        window.approvePartRequest = async function(requestId, approved, quantity, partId, jobId) {
            showLoading();
            try {
                if (approved) {
                    const { data: part } = await DB.getPartById(partId);
                    if (part.stock_quantity < quantity) { 
                        hideLoading(); 
                        showToast('warning', 'ສາງບໍ່ພຽງພໍ', `ມີສາງ ${part.stock_quantity} ອັນ ແຕ່ຕ້ອງການ ${quantity} ອັນ`); 
                        return; 
                    }
                    await DB.updatePartStock(partId, part.stock_quantity - quantity);
                    await DB.updateJobPartStatus(requestId, 'approved');
                    await DB.updateJobCard(jobId, { status: 'parts_approved' });
                    
                    const { data: job } = await DB.getJobCardById(jobId);
                    const mechanicName = job?.mechanic?.name || 'N/A';
                    const customerName = job?.vehicles?.customers?.name || 'N/A';
                    const jobNumber = job?.job_number || 'N/A';
                    
                    await printWarehouseReceipt(requestId, part.name, quantity, jobNumber, customerName, mechanicName);
                    showToast('success', 'ສຳເລັດ', 'ອະນຸມັດ ແລະ ເບີກອາໄຫຼ່ສຳເລັດ');
                } else {
                    await DB.updateJobPartStatus(requestId, 'rejected');
                    showToast('success', 'ສຳເລັດ', 'ປະຕິເສດຄຳຂໍແລ້ວ');
                }
                await loadPartsRequests();
            } catch (error) { 
                hideLoading(); 
                showToast('error', 'ຜິດພາດ', error.message); 
            }
            hideLoading();
        };

        window.showQRScannerForRequest = function() {
            showQRScannerModal('ສະແກນ QR ເພື່ອຊອກຫາຄຳຂໍ', async (scannedData) => {
                showToast('info', 'ຊອກຫາ', 'ກຳລັງຊອກຫາຄຳຂໍ...');
                const result = parseQRCode(scannedData);
                let partId = null;
                if (result && result.type === 'part') {
                    partId = result.id;
                } else {
                    const { data: part } = await DB.getPartByCode(scannedData);
                    if (part) partId = part.id;
                }
                if (partId) {
                    const { data: requests } = await DB.getPartsRequests();
                    const matchingRequests = requests?.filter(r => r.part_id === partId) || [];

            showLoading();
            try {
                const notes = document.getElementById('pdi_notes')?.value || '';
                await DB.savePDIResults(jobId, pdiResults, notes);
                const newStatus = passed ? 'pdi_passed' : 'pdi_failed';

                document.querySelector('.modal.show')?.remove();
                showToast('success', 'ສຳເລັດ', passed ? 'PDI ຜ່ານ! ຍານພາຫະນະພ້ອມສົ່ງມອບ' : 'PDI ບໍ່ຜ່ານ! ຕ້ອງກັບໄປແກ້ໄຂ');

                                    <option value="general" ${part.category === 'general' ? 'selected' : ''}>ທົ່ວໄປ</option>
                                    <option value="engine" ${part.category === 'engine' ? 'selected' : ''}>ເຄື່ອງຈັກ</option>
                                    <option value="electrical" ${part.category === 'electrical' ? 'selected' : ''}>ໄຟຟ້າ</option>
                                    <option value="brake" ${part.category === 'brake' ? 'selected' : ''}>ເບຣກ</option>
                                    <option value="body" ${part.category === 'body' ? 'selected' : ''}>ຕົວຖັງ</option>
                                </select>
                            </div>
                            <div class="form-group"><label>ຍີ່ຫໍ້</label><input type="text" id="edit_part_brand" value="${part.brand || ''}"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>ຈຳນວນສາງ</label><input type="number" id="edit_part_stock" value="${part.stock_quantity}"></div>
                            <div class="form-group"><label>ລາຄາ (₭)</label><input type="number" id="edit_part_price" value="${part.price}"></div>
                        </div>
                        <div class="form-group"><label>ລາຍລະອຽດ</label><textarea id="edit_part_desc" rows="2">${part.description || ''}</textarea></div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="this.closest('.modal').remove()">ຍົກເລີກ</button>
                        <button class="btn btn-primary" onclick="updatePart('${part.id}')">ບັນທຶກ</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.updatePart = async function(partId) {
            showLoading();
            try {
                await DB.updatePart(partId, { 
                    name: document.getElementById('edit_part_name')?.value, 
                    category: document.getElementById('edit_part_category')?.value, 
                    brand: document.getElementById('edit_part_brand')?.value, 
                    stock_quantity: parseInt(document.getElementById('edit_part_stock')?.value) || 0, 
                    price: parseFloat(document.getElementById('edit_part_price')?.value) || 0, 
                    description: document.getElementById('edit_part_desc')?.value 
                });
                hideLoading();
                document.querySelector('.modal.show')?.remove();
                showToast('success', 'ສຳເລັດ', 'ອັບເດດຂໍ້ມູນສຳເລັດ');
                await loadParts();
            } catch (error) { 
                hideLoading(); 
                showToast('error', 'ຜິດພາດ', error.message); 
            }
        };

        window.deletePart = async function(partId) {
            if (currentUser.role !== 'admin') { 
                showToast('warning', 'ບໍ່ມີສິດ', 'ສະເພາະຜູ້ບໍລິຫານເທົ່ານັ້ນ'); 
                return; 
            }
            if (!confirm('ທ່ານແນ່ໃຈບໍ່ວ່າຕ້ອງການລຶບອາໄຫຼ່ນີ້?')) return;
            showLoading();
            try {
                await DB.deletePart(partId);
                hideLoading();
                showToast('success', 'ສຳເລັດ', 'ລຶບອາໄຫຼ່ສຳເລັດ');
                await loadParts();
            } catch (error) { 
                hideLoading(); 
                showToast('error', 'ຜິດພາດ', error.message); 
            }
        };

        window.showInventoryMovement = async function(partId) {
            const { data: part } = await DB.getPartById(partId);
            const { data: movements } = await DB.getInventoryMovements(partId);
            const modal = document.createElement('div');
            modal.className = 'modal show';
            modal.innerHTML = `
                <div class="modal-content" style="max-width:700px;">
                    <div class="modal-header">
                        <h3><i class="fas fa-chart-line"></i> ປະຫວັດການເຄື່ອນໄຫວ: ${part?.code} - ${part?.name}</h3>
                        <button class="close-btn" onclick="this.closest('.modal').remove()">&times;</button>
                    </div>
                    <div class="modal-body">
                        ${movements?.length ? `
                            <div style="max-height:500px;overflow-y:auto;">
                                <table class="data-table">
                                    <thead>
                                        <tr><th>ວັນທີ</th><th>ປະເພດ</th><th>ຈຳນວນ</th><th>ໃບສັ່ງງານ</th><th>ລູກຄ້າ</th></tr>
                                    </thead>
                                    <tbody>
                                        ${movements.map(m => `
                                            <tr>
                                                <td>${formatDateTime(m.approved_at || m.created_at)}</td
                                                <td><span class="status-badge status-approved">ເບີກອອກ</span></td
                                                <td style="color: var(--danger); font-weight: bold;">-${m.quantity}</td
                                                <td>${m.job_cards?.job_number || '-'}</td
                                                <td>${m.job_cards?.vehicles?.customers?.name || '-'}</td
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        ` : '<div class="empty-state">ບໍ່ມີປະຫວັດການເຄື່ອນໄຫວ</div>'}
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="this.closest('.modal').remove()">ປິດ</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.showBulkUploadModal = function() {
            if (currentUser.role !== 'admin') { 
                showToast('warning', 'ບໍ່ມີສິດ', 'ສະເພາະຜູ້ບໍລິຫານເທົ່ານັ້ນ'); 
                return; 
            }
            
            const modal = document.createElement('div');
            modal.className = 'modal show';
            modal.innerHTML = `
                <div class="modal-content" style="max-width:800px;">
                    <div class="modal-header">
                        <h3><i class="fas fa-file-excel"></i> ນຳເຂົ້າຂໍ້ມູນຈາກ Excel</h3>
                        <button class="close-btn" onclick="this.closest('.modal').remove()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="file-upload-area" id="excel-upload-area">
                            <i class="fas fa-cloud-upload-alt fa-2x"></i>
                            <p>ກົດເພື່ອເລືອກຟາຍ Excel (ຫຼືລາກມາວາງ)</p>
                            <p style="font-size:12px;color:var(--gray-500);">ຮູບແບບທີ່ຮອງຮັບ: .xlsx, .xls<br>ຕ້ອງມີຄໍລໍາ: code, name, category, brand, stock_quantity, price</p>
                        </div>
                        <div id="preview-data" style="margin-top:20px;display:none;"></div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="this.closest('.modal').remove()">ຍົກເລີກ</button>
                        <button class="btn btn-primary" id="confirm-upload-btn" style="display:none;" onclick="confirmBulkUpload()">ຢືນຢັນການນຳເຂົ້າ</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            const uploadArea = document.getElementById('excel-upload-area');
            let uploadedData = [];
            
            uploadArea.onclick = () => { 
                const input = document.createElement('input'); 
                input.type = 'file'; 
                input.accept = '.xlsx,.xls,.csv'; 
                input.onchange = (e) => processExcelFile(e.target.files[0]); 
                input.click(); 
            };
            
            uploadArea.ondragover = (e) => { 
                e.preventDefault(); 
                uploadArea.style.borderColor = 'var(--primary)'; 
            };
            
            uploadArea.ondragleave = () => uploadArea.style.borderColor = 'var(--gray-300)';
            
            uploadArea.ondrop = (e) => { 
                e.preventDefault(); 
                processExcelFile(e.dataTransfer.files[0]); 
            };
            
            function processExcelFile(file) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet);
                    uploadedData = rows.map(row => ({
                        code: row.code || row['ລະຫັດ'],
                        name: row.name || row['ຊື່'],
                        category: row.category || row['ປະເພດ'] || 'general',
                        brand: row.brand || row['ຍີ່ຫໍ້'] || '',
                        stock_quantity: parseInt(row.stock_quantity || row['ຈຳນວນ'] || 0),
                        price: parseFloat(row.price || row['ລາຄາ'] || 0),
                        description: row.description || row['ລາຍລະອຽດ'] || '',
                        qr_code: generatePartQRCode(null, row.code || row['ລະຫັດ'])
                    }));
                    const preview = document.getElementById('preview-data');
                    preview.style.display = 'block';
                    preview.innerHTML = `
                        <h4>ພົບ ${uploadedData.length} ລາຍການ</h4>
                        <div style="max-height:300px;overflow-y:auto;">
                            <table class="data-table">
                                <thead><tr><th>ລະຫັດ</th><th>ຊື່</th><th>ຈຳນວນ</th><th>ລາຄາ</th></tr></thead>
                                <tbody>
                                    ${uploadedData.slice(0,10).map(p => `<td><td>${p.code}</td><td>${p.name}</td><td>${p.stock_quantity}</td><td class="currency">${formatCurrency(p.price)}</td></tr>`).join('')}
                                    ${uploadedData.length > 10 ? `<tr><td colspan="4">... ແລະອີກ ${uploadedData.length-10} ລາຍການ</td></tr>` : ''}
                                </tbody>
                            </table>
                        </div>
                    `;
                    document.getElementById('confirm-upload-btn').style.display = 'inline-flex';
                };
                reader.readAsArrayBuffer(file);
            }
            
            window.confirmBulkUpload = async function() {
                showLoading();
                try {
                    let successCount = 0;
                    let errorCount = 0;
                    
                    for (const part of uploadedData) {
                        try {
                            const { data: existing } = await DB.getPartByCode(part.code);
                            if (!existing) {
                                await DB.createPart(part);
                                successCount++;
                            } else {
                                errorCount++;
                            }
                        } catch (err) {
                            errorCount++;
                        }
                    }
                    
                    hideLoading();
                    document.querySelector('.modal.show')?.remove();
                    showToast('success', 'ສຳເລັດ', `ນຳເຂົ້າສຳເລັດ ${successCount} ລາຍການ, ຊ້ຳ ${errorCount} ລາຍການ`);
                    await loadParts();
                } catch (error) { 
                    hideLoading(); 
                    showToast('error', 'ຜິດພາດ', error.message); 
                }
            };
        };

                // ============================================
        // DOM INITIALIZATION
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            initSupabase();
            
            const savedUser = getCurrentUser();
            if (savedUser && savedUser.id) { 
                currentUser = savedUser; 
                showMainApp(); 
            }
            
            document.getElementById('login-btn').addEventListener('click', async () => {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const role = document.getElementById('role').value;
                const errorDiv = document.getElementById('login-error');
                
                if (!role) {
                    errorDiv.textContent = 'ກະລຸນາເລືອກຕຳແໜ່ງ';
                    errorDiv.classList.add('show');
                    return;
                }
                
                const success = await login(email, password, role);
                if (success) {
                    errorDiv.classList.remove('show');
                } else {
                    errorDiv.textContent = 'ອີເມວ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ';
                    errorDiv.classList.add('show');
                }
            });
            
            document.getElementById('logout-btn').addEventListener('click', logout);
            document.getElementById('menu-toggle').addEventListener('click', toggleSidebar);
            
            document.getElementById('notification-bell').addEventListener('click', async () => {
                const { data: notifications } = await DB.getUnreadNotifications(currentUser?.id);
                if (notifications?.length) { 
                    let msg = ''; 
                    notifications.forEach(n => { msg += `${n.title}: ${n.message}\n`; }); 
                    alert(msg); 
                    for (const n of notifications) await DB.markNotificationRead(n.id); 
                    await loadNotifications(); 
                } else {
                    showToast('info', 'ແຈ້ງເຕືອນ', 'ບໍ່ມີການແຈ້ງເຕືອນໃໝ່');
                }
            });
            
            ['email', 'password', 'role'].forEach(id => { 
                document.getElementById(id).addEventListener('keypress', (e) => { 
                    if (e.key === 'Enter') document.getElementById('login-btn').click(); 
                }); 
            });
        });
    </script>
</body>
</html>
