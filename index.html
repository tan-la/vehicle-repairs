<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Repair Center</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<base target="_blank">
</head>
<body>
    <div id="login-page" class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo"><i class="fas fa-car-crash"></i></div>
                <h1>ລະບົບຈັດການສູນສ້ອມແປງຍານພາຫະນະ</h1>
                <p class="subtitle">Vehicle Repair Center Management System</p>
            </div>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> ອີເມວ</label>
                    <input type="email" id="email" name="email" placeholder="admin@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> ລະຫັດຜ່ານ</label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" placeholder="123456" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="role"><i class="fas fa-user-tag"></i> ຕຳແໜ່ງ</label>
                    <select id="role" name="role" required>
                        <option value="">ເລືອກຕຳແໜ່ງ</option>
                        <option value="reception">ຝ່າຍຕ້ອນຮັບ</option>
                        <option value="mechanic">ຊ່າງສ້ອມແປງ</option>
                        <option value="warehouse">ຝ່າຍສາງ</option>
                        <option value="pdi">ຝ່າຍກວດກາ PDI</option>
                        <option value="admin">ຜູ້ບໍລິຫານ</option>
                    </select>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> ເຂົ້າສູ່ລະບົບ
                </button>
                <div id="login-error" class="error-message"></div>
            </form>
            <div class="login-footer">
                <p>2024 Vehicle Repair Center - Laos</p>
                <p style="margin-top:8px; font-size:0.75rem; color:var(--gray-400);">
                    Demo: admin@example.com / 123456
                </p>
            </div>
        </div>
    </div>

    <div id="main-app" class="app-container" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-small"><i class="fas fa-car-crash"></i></div>
                <span class="brand-name">VRMS</span>
            </div>
            <nav class="sidebar-nav">
                <ul id="nav-menu"></ul>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
                    <div class="user-details">
                        <span id="user-name" class="user-name">User</span>
                        <span id="user-role" class="user-role">Role</span>
                    </div>
                </div>
                <button onclick="logout()" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="page-title">
                    <h2 id="page-title">Dashboard</h2>
                </div>
                <div class="top-actions">
                    <div class="notification-bell">
                        <i class="fas fa-bell"></i>
                        <span id="notification-count" class="badge">0</span>
                    </div>
                    <div class="current-time" id="current-time"></div>
                </div>
            </header>
            <div id="content-area" class="content-area"></div>
        </main>
    </div>

    <div id="qr-modal" class="modal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3><i class="fas fa-qrcode"></i> Scan QR Code</h3>
                <button class="close-btn" onclick="closeQRModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="qr-reader"></div>
                <div id="qr-result" class="qr-result"></div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <!-- Load scripts in CORRECT order -->
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/qr-scanner.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
