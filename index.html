<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Repair Center Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --success: #059669;
            --success-light: #d1fae5;
            --warning: #d97706;
            --warning-light: #fef3c7;
            --danger: #dc2626;
            --danger-light: #fee2e2;
            --info: #0891b2;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --white: #ffffff;
            --sidebar-width: 280px;
            --header-height: 60px;
            --border-radius: 8px;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Noto Sans Lao', sans-serif;
            background: var(--gray-100);
            color: var(--gray-800);
            line-height: 1.6;
        }

        /* Login Page */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 20px;
        }

        .login-box {
            background: var(--white);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header { text-align: center; margin-bottom: 32px; }
        
        .login-header .logo {
            width: 80px;
            height: 80px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        
        .login-header .logo i { font-size: 36px; color: var(--primary); }
        .login-header h1 { font-size: 1.25rem; font-weight: 700; color: var(--gray-800); margin-bottom: 4px; }
        .login-header .subtitle { font-size: 0.875rem; color: var(--gray-500); }

        .login-form .form-group { margin-bottom: 20px; }
        .login-form label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 0.875rem; color: var(--gray-700); }
        .login-form label i { margin-right: 6px; color: var(--primary); }
        
        .login-form input, .login-form select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--gray-200);
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.9375rem;
            transition: var(--transition);
        }
        
        .login-form input:focus, .login-form select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-login:hover { background: var(--primary-dark); }

        .error-message {
            color: var(--danger);
            font-size: 0.875rem;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
        
        .error-message.show { display: block; }

        /* App Layout */
        .app-container { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: var(--sidebar-width);
            background: var(--white);
            border-right: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: var(--transition);
        }
        
        .sidebar.collapsed { width: 70px; }
        
        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            gap: 12px;
            height: var(--header-height);
        }
        
        .logo-small {
            width: 36px;
            height: 36px;
            background: var(--primary-light);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-small i { color: var(--primary); font-size: 1.125rem; }
        .brand-name { font-weight: 700; font-size: 1.125rem; color: var(--gray-800); }
        .sidebar.collapsed .brand-name { display: none; }
        
        .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
        .sidebar-nav ul { list-style: none; }
        .sidebar-nav li { margin-bottom: 4px; }
        
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--border-radius);
            color: var(--gray-600);
            text-decoration: none;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
        }
        
        .sidebar-nav a:hover { background: var(--gray-100); color: var(--primary); }
        .sidebar-nav a.active { background: var(--primary-light); color: var(--primary); }
        .sidebar.collapsed .sidebar-nav a span { display: none; }
        
        .sidebar-footer { padding: 16px; border-top: 1px solid var(--gray-200); }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .user-avatar i { font-size: 1.25rem; color: var(--primary); }
        .user-name { font-weight: 600; font-size: 0.875rem; color: var(--gray-800); }
        .user-role { font-size: 0.75rem; color: var(--gray-500); }
        .sidebar.collapsed .user-details { display: none; }
        
        .btn-logout {
            width: 100%;
            padding: 10px;
            background: var(--danger-light);
            color: var(--danger);
            border: none;
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .btn-logout:hover { background: var(--danger); color: var(--white); }
        
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            transition: var(--transition);
        }
        
        .sidebar.collapsed + .main-content { margin-left: 70px; }
        
        .top-bar {
            height: var(--header-height);
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        
        .menu-toggle {
            background: none;
            border: none;
            color: var(--gray-600);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 8px;
            border-radius: var(--border-radius);
        }
        
        .page-title { margin-left: 16px; flex: 1; }
        .page-title h2 { font-size: 1.25rem; font-weight: 600; color: var(--gray-800); }
        
        .top-actions { display: flex; align-items: center; gap: 16px; }
        .current-time { font-size: 0.875rem; color: var(--gray-500); }
        
        .content-area { padding: 24px; }

        /* Dashboard Cards */
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: var(--white);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
        }
        
        .stat-card.success { border-left-color: var(--success); }
        .stat-card.warning { border-left-color: var(--warning); }
        .stat-card.info { border-left-color: var(--info); }
        
        .stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .stat-label { font-size: 0.875rem; color: var(--gray-500); }
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-light);
            color: var(--primary);
        }
        .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--gray-800); }

        /* Tables */
        .data-table-container {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        
        .table-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .table-title { font-size: 1.125rem; font-weight: 600; color: var(--gray-800); }
        
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 14px 24px; text-align: left; font-size: 0.875rem; }
        .data-table th {
            background: var(--gray-50);
            color: var(--gray-600);
            font-weight: 600;
            font-size: 0.75rem;
            border-bottom: 2px solid var(--gray-200);
        }
        .data-table tbody tr { border-bottom: 1px solid var(--gray-100); }
        .data-table tbody tr:hover { background: var(--gray-50); }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
        .status-pending { background: var(--warning-light); color: var(--warning); }
        .status-pending::before { background: var(--warning); }
        .status-approved { background: var(--success-light); color: var(--success); }
        .status-approved::before { background: var(--success); }
        .status-progress { background: var(--info-light); color: var(--info); }
        .status-progress::before { background: var(--info); }
        .status-completed { background: var(--primary-light); color: var(--primary); }
        .status-completed::before { background: var(--primary); }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }
        .btn-primary { background: var(--primary); color: var(--white); }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline { background: transparent; border: 2px solid var(--gray-300); color: var(--gray-600); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .btn-sm { padding: 6px 12px; font-size: 0.8125rem; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--white);
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-header h3 { font-size: 1.125rem; font-weight: 600; }
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--gray-400);
            cursor: pointer;
        }
        .modal-body { padding: 24px; }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--gray-200);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* Form */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 0.875rem; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--gray-200);
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.9375rem;
        }
        .form-group input:focus { outline: none; border-color: var(--primary); }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: var(--white);
            border-radius: 10px;
            box-shadow: var(--shadow-lg);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            animation: slideInRight 0.3s ease;
            border-left: 4px solid var(--primary);
        }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .toast-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toast.success .toast-icon { background: var(--success-light); color: var(--success); }
        .toast.error .toast-icon { background: var(--danger-light); color: var(--danger); }
        .toast-content { flex: 1; }
        .toast-title { font-weight: 600; font-size: 0.9375rem; }
        .toast-message { font-size: 0.8125rem; color: var(--gray-500); }

        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state-icon {
            width: 80px;
            height: 80px;
            background: var(--gray-100);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .empty-state-icon i { font-size: 2rem; color: var(--gray-400); }
        .currency::after { content: ' ₭'; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); position: fixed; }
            .sidebar.show { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .dashboard-stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- LOGIN PAGE -->
    <div id="login-page" class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo"><i class="fas fa-car-crash"></i></div>
                <h1>ລະບົບຈັດການສູນສ້ອມແປງຍານພາຫະນະ</h1>
                <p class="subtitle">Vehicle Repair Center Management System</p>
            </div>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> ອີເມວ</label>
                    <input type="email" id="email" placeholder="test@test.com" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> ລະຫັດຜ່ານ</label>
                    <input type="password" id="password" placeholder="123456" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user-tag"></i> ຕຳແໜ່ງ</label>
                    <select id="role" required>
                        <option value="">ເລືອກຕຳແໜ່ງ</option>
                        <option value="reception">ຝ່າຍຕ້ອນຮັບ</option>
                        <option value="mechanic">ຊ່າງສ້ອມແປງ</option>
                        <option value="warehouse">ຝ່າຍສາງ</option>
                        <option value="pdi">ຝ່າຍກວດກາ PDI</option>
                        <option value="admin">ຜູ້ບໍລິຫານ</option>
                    </select>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> ເຂົ້າສູ່ລະບົບ
                </button>
                <div id="login-error" class="error-message"></div>
            </form>
            <div class="login-footer" style="text-align: center; margin-top: 24px; font-size: 0.75rem; color: var(--gray-400);">
                <p>Demo: any email + password 123456 + select role</p>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="app-container" style="display: none;">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-small"><i class="fas fa-car-crash"></i></div>
                <span class="brand-name">VRMS</span>
            </div>
            <nav class="sidebar-nav">
                <ul id="nav-menu"></ul>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
                    <div class="user-details">
                        <span id="user-name" class="user-name">User</span>
                        <span id="user-role" class="user-role">Role</span>
                    </div>
                </div>
                <button id="logout-btn" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="page-title">
                    <h2 id="page-title">Dashboard</h2>
                </div>
                <div class="top-actions">
                    <div class="current-time" id="current-time"></div>
                </div>
            </header>
            <div id="content-area" class="content-area">
                <!-- Content will be loaded here -->
                <div style="text-align: center; padding: 50px;">
                    <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary);"></i>
                    <p>ກຳລັງໂຫລດ...</p>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script>
        // ============================================
        // DEMO DATA (works without database)
        // ============================================
        const DEMO_STAFF = [
            { id: '1', name: 'ສົມຈິດ ສຸກສະຫວັນ', email: 'test@test.com', role: 'reception', phone: '02012345678' },
            { id: '2', name: 'ວິໄລ ພົມມະວົງ', email: 'vilay@test.com', role: 'mechanic', phone: '02087654321' },
            { id: '3', name: 'ຄຳພອນ ແກ້ວຄຳ', email: 'khamphone@test.com', role: 'warehouse', phone: '02011223344' },
            { id: '4', name: 'ບຸນມີ ວົງສະຫວັນ', email: 'bounmee@test.com', role: 'pdi', phone: '02055667788' },
            { id: '5', name: 'ທອງລີ ສີສຸວັນ', email: 'admin@test.com', role: 'admin', phone: '02099887766' }
        ];

        const DEMO_JOBS = [
            { id: '1', job_number: 'JC240101-0001', vehicle: 'Toyota Vios', customer: 'ສົມສັກ ແກ້ວຄຳ', status: 'completed', date: '2024-01-15', mechanic: 'ວິໄລ ພົມມະວົງ' },
            { id: '2', job_number: 'JC240102-0002', vehicle: 'Honda CR-V', customer: 'ມາລີ ສີຫາວົງ', status: 'in_progress', date: '2024-01-16', mechanic: 'ສົມພອນ ຈັນທະວົງ' },
            { id: '3', job_number: 'JC240103-0003', vehicle: 'Ford Ranger', customer: 'ບຸນທອນ ວົງພະຈັນ', status: 'pending', date: '2024-01-17', mechanic: '' },
            { id: '4', job_number: 'JC240104-0004', vehicle: 'Mitsubishi Pajero', customer: 'ສຸວັນນີ ອິນທະວົງ', status: 'assigned', date: '2024-01-18', mechanic: 'ຄຳພອນ ແສງອາລຸນ' }
        ];

        let currentUser = null;
        let currentPage = 'dashboard';

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function showToast(type, title, message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div class="toast-icon"><i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-times-circle'}"></i></div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentElement) toast.remove(); }, 3000);
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const d = new Date(dateString);
            return d.toLocaleDateString('lo-LA');

            };
            return labels[status] || status;
        }

        function getStatusBadgeClass(status) {
            const classes = {
                'pending': 'status-pending', 'assigned': 'status-progress', 'in_progress': 'status-progress',
                'completed': 'status-completed', 'released': 'status-completed'
            };
            return classes[status] || 'status-pending';

            const labels = { 'reception': 'ຝ່າຍຕ້ອນຮັບ', 'mechanic': 'ຊ່າງສ້ອມແປງ', 'warehouse': 'ຝ່າຍສາງ', 'pdi': 'ຝ່າຍກວດກາ PDI', 'admin': 'ຜູ້ບໍລິຫານ' };
            return labels[role] || role;
        }

        function getCurrentUser() {
            const user = localStorage.getItem('vrms_user');
            return user ? JSON.parse(user) : null;
        }

        function setCurrentUser(user) {
            localStorage.setItem('vrms_user', JSON.stringify(user));
            currentUser = user;

        function clearCurrentUser() {
            localStorage.removeItem('vrms_user');

            // Demo login - check against demo staff

            if (!user) {
                return { success: false, error: 'ບໍ່ພົບຜູ້ໃຊ້ ຫຼື ຕຳແໜ່ງບໍ່ຖືກຕ້ອງ' };
            }
            if (password !== '123456') {
                return { success: false, error: 'ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ (ຕ້ອງເປັນ 123456)' };

            setCurrentUser({ id: user.id, email: user.email, name: user.name, role: user.role });

            showMainApp();

        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleDateString('lo-LA', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        }

        function showMainApp() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            document.getElementById('user-name').textContent = currentUser.name;
            document.getElementById('user-role').textContent = getRoleLabel(currentUser.role);
            buildNavigation(currentUser.role);
            loadDashboard();
            updateTime();
            setInterval(updateTime, 1000);
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            // Check for saved user
            const savedUser = getCurrentUser();
            if (savedUser && savedUser.id) {
                currentUser = savedUser;
                showMainApp();
            }

            // Login form handler
            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const role = document.getElementById('role').value;
                const errorDiv = document.getElementById('login-error');
                
                if (!role) {
                    errorDiv.textContent = 'ກະລຸນາເລືອກຕຳແໜ່ງ';
                    errorDiv.classList.add('show');
                    return;
                }
                
                const result = await login(email, password, role);
                if (!result.success) {
                    errorDiv.textContent = result.error;
                    errorDiv.classList.add('show');
                } else {
                    errorDiv.classList.remove('show');
                }
            });

            // Logout button
            document.getElementById('logout-btn').addEventListener('click', logout);
        });
    </script>

</html>
