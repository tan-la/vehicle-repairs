<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Repair Center Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ============================================
           Vehicle Repair Center Management System
           Lao Language - LAK Currency
           ============================================ */

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --secondary: #64748b;
            --success: #059669;
            --success-light: #d1fae5;
            --warning: #d97706;
            --warning-light: #fef3c7;
            --danger: #dc2626;
            --danger-light: #fee2e2;
            --info: #0891b2;
            --info-light: #cffafe;
            --dark: #1e293b;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --white: #ffffff;
            --sidebar-width: 280px;
            --sidebar-collapsed: 70px;
            --header-height: 60px;
            --border-radius: 8px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans Lao', 'Phetsarath OT', 'Saysettha OT', sans-serif;
            background: var(--gray-100);
            color: var(--gray-800);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* LOGIN PAGE */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 20px;
        }

        .login-box {
            background: var(--white);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .logo {
            width: 80px;
            height: 80px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .login-header .logo i {
            font-size: 36px;
            color: var(--primary);
        }

        .login-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 4px;
        }

        .login-header .subtitle {
            font-size: 0.875rem;
            color: var(--gray-500);
        }

        .login-form .form-group {
            margin-bottom: 20px;
        }

        .login-form label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--gray-700);
            font-size: 0.875rem;
        }

        .login-form label i {
            margin-right: 6px;
            color: var(--primary);
            width: 16px;
        }

        .login-form input,
        .login-form select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--gray-200);
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.9375rem;
            transition: var(--transition);
            background: var(--white);
        }

        .login-form input:focus,
        .login-form select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .password-input {
            position: relative;
        }

        .password-input input {
            padding-right: 44px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.875rem;
            margin-top: 12px;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--gray-400);
        }

        /* APP LAYOUT */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--white);
            border-right: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: var(--transition);
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed);
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            gap: 12px;
            height: var(--header-height);
        }

        .logo-small {
            width: 36px;
            height: 36px;
            background: var(--primary-light);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-small i {
            color: var(--primary);
            font-size: 1.125rem;
        }

        .brand-name {
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--gray-800);
        }

        .sidebar.collapsed .brand-name {
            display: none;
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            overflow-y: auto;
        }

        .sidebar-nav ul {
            list-style: none;
        }

        .sidebar-nav li {
            margin-bottom: 4px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--border-radius);
            color: var(--gray-600);
            text-decoration: none;
            font-size: 0.9375rem;
            font-weight: 500;
            transition: var(--transition);
            cursor: pointer;
        }

        .sidebar-nav a:hover {
            background: var(--gray-100);
            color: var(--primary);
        }

        .sidebar-nav a.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        .sidebar.collapsed .sidebar-nav a span {
            display: none;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--gray-200);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-avatar i {
            font-size: 1.25rem;
            color: var(--primary);
        }

        .user-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .user-name {
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--gray-800);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-role {
            font-size: 0.75rem;
            color: var(--gray-500);
        }

        .sidebar.collapsed .user-details {
            display: none;
        }

        .btn-logout {
            width: 100%;
            padding: 10px;
            background: var(--danger-light);
            color: var(--danger);
            border: none;
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-logout:hover {
            background: var(--danger);
            color: var(--white);
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: var(--transition);
        }

        .sidebar.collapsed+.main-content {
            margin-left: var(--sidebar-collapsed);
        }

        .top-bar {
            height: var(--header-height);
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .menu-toggle {
            background: none;
            border: none;
            color: var(--gray-600);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 8px;
            border-radius: var(--border-radius);
        }

        .page-title {
            margin-left: 16px;
            flex: 1;
        }

        .page-title h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--gray-800);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .notification-bell {
            position: relative;
            cursor: pointer;
            padding: 8px;
            border-radius: var(--border-radius);
        }

        .badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--danger);
            color: var(--white);
            font-size: 0.625rem;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 10px;
            min-width: 16px;
            text-align: center;
        }

        .current-time {
            font-size: 0.875rem;
            color: var(--gray-500);
            font-weight: 500;
        }

        .content-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        /* DASHBOARD CARDS */
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--white);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border-left: 4px solid var(--primary);
        }

        .stat-card.success {
            border-left-color: var(--success);
        }

        .stat-card.warning {
            border-left-color: var(--warning);
        }

        .stat-card.danger {
            border-left-color: var(--danger);
        }

        .stat-card.info {
            border-left-color: var(--info);
        }

        .stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--gray-500);
            font-weight: 500;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.125rem;
            background: var(--primary-light);
            color: var(--primary);
        }

        .stat-card.success .stat-icon {
            background: var(--success-light);
            color: var(--success);
        }

        .stat-card.warning .stat-icon {
            background: var(--warning-light);
            color: var(--warning);
        }

        .stat-card.danger .stat-icon {
            background: var(--danger-light);
            color: var(--danger);
        }

        .stat-card.info .stat-icon {
            background: var(--info-light);
            color: var(--info);
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 4px;
        }

        /* TABLES */
        .data-table-container {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .table-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .table-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--gray-800);
        }

        .table-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 10px 14px 10px 38px;
            border: 2px solid var(--gray-200);
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.875rem;
            width: 240px;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 14px 24px;
            text-align: left;
            font-size: 0.875rem;
        }

        .data-table th {
            background: var(--gray-50);
            color: var(--gray-600);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--gray-200);
        }

        .data-table tbody tr {
            border-bottom: 1px solid var(--gray-100);
        }

        .data-table tbody tr:hover {
            background: var(--gray-50);
        }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-pending {
            background: var(--warning-light);
            color: var(--warning);
        }

        .status-pending::before {
            background: var(--warning);
        }

        .status-approved {
            background: var(--success-light);
            color: var(--success);
        }

        .status-approved::before {
            background: var(--success);
        }

        .status-rejected {
            background: var(--danger-light);
            color: var(--danger);
        }

        .status-rejected::before {
            background: var(--danger);
        }

        .status-progress {
            background: var(--info-light);
            color: var(--info);
        }

        .status-progress::before {
            background: var(--info);
        }

        .status-completed {
            background: var(--primary-light);
            color: var(--primary);
        }

        .status-completed::before {
            background: var(--primary);
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-success {
            background: var(--success);
            color: var(--white);
        }

        .btn-danger {
            background: var(--danger);
            color: var(--white);
        }

        .btn-secondary {
            background: var(--gray-200);
            color: var(--gray-700);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--gray-300);
            color: var(--gray-600);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8125rem;
        }

        .btn-icon {
            padding: 8px;
            border-radius: var(--border-radius);
        }

        /* FORMS */
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--gray-700);
            font-size: 0.875rem;
        }

        .form-group .required {
            color: var(--danger);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--gray-200);
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.9375rem;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            padding-top: 16px;
            border-top: 1px solid var(--gray-200);
        }

        /* MODALS */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content.modal-xl {
            max-width: 900px;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h3 {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--gray-800);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--gray-400);
            cursor: pointer;
        }

        .close-btn:hover {
            color: var(--danger);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--gray-200);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* JOB CARD */
        .job-card {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .job-card-header {
            padding: 20px 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
        }

        .job-card-body {
            padding: 24px;
        }

        .job-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .job-info-item {
            padding: 12px;
            background: var(--gray-50);
            border-radius: var(--border-radius);
        }

        .job-info-item .label {
            font-size: 0.75rem;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .job-info-item .value {
            font-weight: 600;
            color: var(--gray-800);
            font-size: 0.9375rem;
        }

        /* TOAST NOTIFICATIONS */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--white);
            border-radius: 10px;
            box-shadow: var(--shadow-lg);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            max-width: 400px;
            animation: slideInRight 0.3s ease;
            border-left: 4px solid var(--primary);
        }

        .toast.success {
            border-left-color: var(--success);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        .toast.warning {
            border-left-color: var(--warning);
        }

        .toast.info {
            border-left-color: var(--info);
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .toast-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .toast.success .toast-icon {
            background: var(--success-light);
            color: var(--success);
        }

        .toast.error .toast-icon {
            background: var(--danger-light);
            color: var(--danger);
        }

            return `
                <table class="data-table"><thead><tr><th>ເລກທີ</th><th>ຍານພາຫະນະ</th><th>ລູກຄ້າ</th><th>ສະຖານະ</th><th>ວັນທີ</th><th>ຈັດການ</th></tr></thead>
                <tbody>${jobs.map(j => `<tr>
                    <td><strong>${j.job_number}</strong></td>
                    <td>${j.vehicles ? `${j.vehicles.brand} ${j.vehicles.model}` : '-'}</td>
                    <td>${j.vehicles?.customers?.name || '-'}</td>
                    <td><span class="status-badge ${getStatusBadgeClass(j.status)}">${getStatusLabel(j.status)}</span></td>
                    <td>${formatDate(j.created_at)}</td>
                    <td><button class="btn btn-sm btn-outline" onclick="viewJobCard('${j.id}')"><i class="fas fa-eye"></i></button></td>
                </tr>`).join('')}</tbody></table>
            `;
        }

        async function loadCustomers() {
            const content = document.getElementById('content-area');
            try {
                const { data: customers } = await DB.getCustomers();
                content.innerHTML = `
                    <div class="data-table-container"><div class="table-header"><h3 class="table-title">ລາຍຊື່ລູກຄ້າ</h3><button class="btn btn-primary" onclick="showAddCustomer()"><i class="fas fa-plus"></i> ເພີ່ມລູກຄ້າ</button></div>
                    ${renderCustomersTable(customers || [])}</div>
                `;
            } catch (error) {
                content.innerHTML = '<div class="empty-state"><h3>ເກີດຂໍ້ຜິດພາດ</h3></div>';
            }
        }

        function renderCustomersTable(customers) {
            if (!customers.length) return '<div class="empty-state"><div class="empty-state-icon"><i class="fas fa-users"></i></div><h3>ບໍ່ມີຂໍ້ມູນລູກຄ້າ</h3></div>';
            return `
                <table class="data-table"><thead><tr><th>ຊື່</th><th>ເບີໂທ</th><th>ອີເມວ</th><th>ວັນທີລົງທະບຽນ</th></tr></thead>
                <tbody>${customers.map(c => `<tr><td><strong>${c.name}</strong></td><td>${c.phone || '-'}</td><td>${c.email || '-'}</td><td>${formatDate(c.created_at)}</td></tr>`).join('')}</tbody></table>
            `;
        }

        function showAddCustomer() {
            const modal = document.createElement('div');
            modal.className = 'modal show';
            modal.id = 'customer-modal';
            modal.innerHTML = `
                <div class="modal-content"><div class="modal-header"><h3>ເພີ່ມລູກຄ້າໃໝ່</h3><button class="close-btn" onclick="this.closest(\'.modal\').remove()">&times;</button></div>
                <div class="modal-body"><div class="form-group"><label>ຊື່ <span class="required">*</span></label><input type="text" id="cust-name" placeholder="ຊື່ ແລະ ນາມສະກຸນ"></div>
                <div class="form-group"><label>ເບີໂທ</label><input type="tel" id="cust-phone" placeholder="020XXXXXXXX"></div>
                <div class="form-group"><label>ອີເມວ</label><input type="email" id="cust-email"></div></div>
                <div class="modal-footer"><button class="btn btn-secondary" onclick="this.closest(\'.modal\').remove()">ຍົກເລີກ</button><button class="btn btn-primary" onclick="saveCustomer()">ບັນທຶກ</button></div></div>
            `;
            document.body.appendChild(modal);
        }

        async function saveCustomer() {
            const name = document.getElementById('cust-name')?.value;
            if (!name) { showToast('warning', 'ແຈ້ງເຕືອນ', 'ກະລຸນາປ້ອນຊື່ລູກຄ້າ'); return; }
            showLoading();
            try {
                await DB.createCustomer({ name, phone: document.getElementById('cust-phone')?.value, email: document.getElementById('cust-email')?.value });
                hideLoading();
                document.querySelector('#customer-modal')?.remove();
                showToast('success', 'ສຳເລັດ', 'ເພີ່ມລູກຄ້າສຳເລັດ');
                loadCustomers();
            } catch (error) {
                hideLoading();
                showToast('error', 'ຜິດພາດ', error.message);
            }
        }

        async function loadVehicles() {
            const content = document.getElementById('content-area');
            try {
                const { data: vehicles } = await DB.getVehicles();
                content.innerHTML = `<div class="data-table-container"><div class="table-header"><h3 class="table-title">ລາຍການຍານພາຫະນະ</h3></div>${renderVehiclesTable(vehicles || [])}</div>`;
            } catch (error) {
                content.innerHTML = '<div class="empty-state"><h3>ເກີດຂໍ້ຜິດພາດ</h3></div>';
            }
        }

        function renderVehiclesTable(vehicles) {
            if (!vehicles.length) return '<div class="empty-state"><div class="empty-state-icon"><i class="fas fa-car"></i></div><h3>ບໍ່ມີຂໍ້ມູນຍານພາຫະນະ</h3></div>';
            return `
                <table class="data-table"><thead><tr><th>ປ້າຍທະບຽນ</th><th>ຍີ່ຫໍ້</th><th>ຮຸ່ນ</th><th>ເຈົ້າຂອງ</th></tr></thead>
                <tbody>${vehicles.map(v => `<tr><td><strong>${v.license_plate}</strong></td><td>${v.brand}</td><td>${v.model}</td><td>${v.customers?.name || '-'}</td></tr>`).join('')}</tbody></table>
            `;
        }

        async function loadJobCards() {
            const content = document.getElementById('content-area');
            try {
                const { data: jobs } = await DB.getJobCards();
                content.innerHTML = `<div class="data-table-container"><div class="table-header"><h3 class="table-title">ລາຍການໃບສັ່ງງານ</h3><button class="btn btn-primary" onclick="showCreateJobCard()"><i class="fas fa-plus"></i> ເປີດໃບສັ່ງງານ</button></div>${renderJobsTable(jobs || [])}</div>`;
            } catch (error) {
                content.innerHTML = '<div class="empty-state"><h3>ເກີດຂໍ້ຜິດພາດ</h3></div>';
            }
        }

        async function showCreateJobCard() {
            const { data: customers } = await DB.getCustomers();
            const { data: mechanics } = await DB.getMechanics();
            const modal = document.createElement('div');
            modal.className = 'modal show';
            modal.id = 'jobcard-modal';
            modal.innerHTML = `
                <div class="modal-content modal-xl"><div class="modal-header"><h3>ເປີດໃບສັ່ງງານໃໝ່</h3><button class="close-btn" onclick="this.closest(\'.modal\').remove()">&times;</button></div>
                <div class="modal-body"><div class="form-row"><div class="form-group"><label>ເລືອກລູກຄ້າ</label><select id="job-customer"><option value="">ເລືອກລູກຄ້າ</option>${customers?.map(c => `<option value="${c.id}">${c.name}</option>`).join('') || ''}</select></div>
                <div class="form-group"><label>ເລືອກຍານພາຫະນະ</label><select id="job-vehicle"><option value="">ເລືອກຍານພາຫະນະ</option></select></div></div>
                <div class="form-group"><label>ບັນຫາທີ່ແຈ້ງ</label><textarea id="job-problem" rows="3"></textarea></div>
                <div class="form-group"><label>ມອບຫມາຍໃຫ້ຊ່າງ</label><select id="job-mechanic"><option value="">ເລືອກຊ່າງ</option>${mechanics?.map(m => `<option value="${m.id}">${m.name}</option>`).join('') || ''}</select></div></div>
                <div class="modal-footer"><button class="btn btn-secondary" onclick="this.closest(\'.modal\').remove()">ຍົກເລີກ</button><button class="btn btn-primary" onclick="saveJobCard()">ບັນທຶກ</button></div></div>
            `;
            document.body.appendChild(modal);

            document.getElementById('job-customer')?.addEventListener('change', async (e) => {
                if (e.target.value) {
                    const { data: vehicles } = await initSupabase().from('vehicles').select('*').eq('customer_id', e.target.value);
                    const select = document.getElementById('job-vehicle');
                    select.innerHTML = '<option value="">ເລືອກຍານພາຫະນະ</option>' + (vehicles?.map(v => `<option value="${v.id}">${v.brand} ${v.model} (${v.license_plate})</option>`).join('') || '');
                }
            });
        }

        async function saveJobCard() {
            const vehicleId = document.getElementById('job-vehicle')?.value;
            const mechanicId = document.getElementById('job-mechanic')?.value;
            const problem = document.getElementById('job-problem')?.value;
            if (!vehicleId || !mechanicId) { showToast('warning', 'ແຈ້ງເຕືອນ', 'ກະລຸນາເລືອກຍານພາຫະນະ ແລະ ຊ່າງ'); return; }
            showLoading();
            try {
                const jobCard = { job_number: generateJobNumber(), vehicle_id: vehicleId, mechanic_id: mechanicId, problem_description: problem, status: 'assigned', created_by: currentUser.id };
                const { data, error } = await DB.createJobCard(jobCard);
                if (error) throw error;
                hideLoading();
                document.querySelector('#jobcard-modal')?.remove();
                showToast('success', 'ສຳເລັດ', `ເປີດໃບສັ່ງງານ ${data.job_number} ສຳເລັດ`);
                loadJobCards();
            } catch (error) {
                hideLoading();
                showToast('error', 'ຜິດພາດ', error.message);
            }
        }

        async function viewJobCard(jobId) {
            showLoading();
            const { data: job } = await DB.getJobCardById(jobId);
            hideLoading();
            if (!job) { showToast('error', 'ຜິດພາດ', 'ບໍ່ພົບໃບສັ່ງງານ'); return; }
            const modal = document.createElement('div');
            modal.className = 'modal show';
            modal.innerHTML = `
                <div class="modal-content"><div class="modal-header"><h3>ໃບສັ່ງງານ ${job.job_number}</h3><button class="close-btn" onclick="this.closest(\'.modal\').remove()">&times;</button></div>
                <div class="modal-body"><div class="job-info-grid"><div class="job-info-item"><div class="label">ລູກຄ້າ</div><div class="value">${job.vehicles?.customers?.name || '-'}</div></div>
                <div class="job-info-item"><div class="label">ຍານພາຫະນະ</div><div class="value">${job.vehicles?.brand} ${job.vehicles?.model} (${job.vehicles?.license_plate})</div></div>
                <div class="job-info-item"><div class="label">ຊ່າງ</div><div class="value">${job.mechanics?.name || '-'}</div></div>
                <div class="job-info-item"><div class="label">ສະຖານະ</div><div class="value"><span class="status-badge ${getStatusBadgeClass(job.status)}">${getStatusLabel(job.status)}</span></div></div></div>
                <div><h4>ບັນຫາ</h4><p>${job.problem_description || '-'}</p></div></div>
                <div class="modal-footer"><button class="btn btn-secondary" onclick="this.closest(\'.modal\').remove()">ປິດ</button></div></div>
            `;
            document.body.appendChild(modal);
        }

        async function loadMyJobs() {
            const content = document.getElementById('content-area');
            try {
                const { data: jobs } = await initSupabase().from('job_cards').select('*, vehicles(*, customers(*))').eq('mechanic_id', currentUser.id).order('created_at', { ascending: false });
                content.innerHTML = `<div class="data-table-container"><div class="table-header"><h3 class="table-title">ງານຂອງຂ້ອຍ</h3></div>${renderJobsTable(jobs || [])}</div>`;
            } catch (error) {
                content.innerHTML = '<div class="empty-state"><h3>ເກີດຂໍ້ຜິດພາດ</h3></div>';
            }
        }

        async function loadPartsInventory() {
            const content = document.getElementById('content-area');
            try {
                const { data: parts } = await DB.getParts();
                content.innerHTML = `<div class="data-table-container"><div class="table-header"><h3 class="table-title">ສາງອາໄຫຼ່</h3></div>${renderPartsTable(parts || [])}</div>`;
            } catch (error) {
                content.innerHTML = '<div class="empty-state"><h3>ເກີດຂໍ້ຜິດພາດ</h3></div>';
            }
        }

        function renderPartsTable(parts) {
            if (!parts.length) return '<div class="empty-state"><div class="empty-state-icon"><i class="fas fa-boxes"></i></div><h3>ບໍ່ມີຂໍ້ມູນອາໄຫຼ່</h3></div>';
            return `
                <table class="data-table"><thead><tr><th>ລະຫັດ</th><th>ຊື່ອາໄຫຼ່</th><th>ຈຳນວນ</th><th>ລາຄາ</th></tr></thead>
                <tbody>${parts.map(p => `<tr><td><code>${p.code}</code></td><td><strong>${p.name}</strong></td><td>${p.stock_quantity}</td><td class="currency">${formatCurrency(p.price)}</td></tr>`).join('')}</tbody></table>
            `;
        }

        async function loadPDICheck() {
            const content = document.getElementById('content-area');
            try {
                const { data: jobs } = await initSupabase().from('job_cards').select('*, vehicles(*, customers(*))').eq('status', 'completed').order('created_at', { ascending: false });
                content.innerHTML = `<div class="data-table-container"><div class="table-header"><h3 class="table-title">ຍານພາຫະນະລໍຖ້າກວດກາ PDI</h3></div>${renderJobsTable(jobs || [])}</div>`;
            } catch (error) {
                content.innerHTML = '<div class="empty-state"><h3>ເກີດຂໍ້ຜິດພາດ</h3></div>';
            }
        }

        async function loadStaff() {
            const content = document.getElementById('content-area');
            try {
                const { data: staff } = await DB.getStaff();
                content.innerHTML = `<div class="data-table-container"><div class="table-header"><h3 class="table-title">ລາຍຊື່ພະນັກງານ</h3></div>${renderStaffTable(staff || [])}</div>`;
            } catch (error) {
                content.innerHTML = '<div class="empty-state"><h3>ເກີດຂໍ້ຜິດພາດ</h3></div>';
            }
        }

        function renderStaffTable(staff) {
            if (!staff.length) return '<div class="empty-state"><div class="empty-state-icon"><i class="fas fa-users"></i></div><h3>ບໍ່ມີຂໍ້ມູນພະນັກງານ</h3></div>';
            return `
                <table class="data-table"><thead><tr><th>ຊື່</th><th>ຕຳແໜ່ງ</th><th>ເບີໂທ</th><th>ອີເມວ</th></tr></thead>
                <tbody>${staff.map(s => `<tr><td><strong>${s.name}</strong></td><td>${getRoleLabel(s.role)}</td><td>${s.phone || '-'}</td><td>${s.email || '-'}</td></tr>`).join('')}</tbody></table>
            `;
        }

        function showMainApp() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            document.getElementById('user-name').textContent = currentUser.name;
            document.getElementById('user-role').textContent = getRoleLabel(currentUser.role);
            buildNavigation(currentUser.role);
            loadDashboard();
            updateTime();
            setInterval(updateTime, 1000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initSupabase();
            const savedUser = getCurrentUser();
            if (savedUser) {
                currentUser = savedUser;
                showMainApp();
            }

            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const role = document.getElementById('role').value;
                const errorDiv = document.getElementById('login-error');
                if (!role) {
                    errorDiv.textContent = 'ກະລຸນາເລືອກຕຳແໜ່ງ';
                    errorDiv.classList.add('show');
                    return;
                }
                const result = await login(email, password, role);
                if (!result.success) {
                    errorDiv.textContent = result.error;
                    errorDiv.classList.add('show');
                }
            });
        });
    </script>
</body>
</html>
