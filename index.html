<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Repair Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    :root {
        --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #dbeafe;
        --secondary: #64748b; --success: #059669; --success-light: #d1fae5;
        --warning: #d97706; --warning-light: #fef3c7; --danger: #dc2626; --danger-light: #fee2e2;
        --info: #0891b2; --info-light: #cffafe; --dark: #1e293b;
        --gray-100: #f1f5f9; --gray-200: #e2e8f0; --gray-300: #cbd5e1;
        --gray-400: #94a3b8; --gray-500: #64748b; --gray-600: #475569;
        --gray-700: #334155; --gray-800: #1e293b; --gray-900: #0f172a; --white: #ffffff;
        --sidebar-width: 280px; --sidebar-collapsed: 70px; --header-height: 60px;
        --border-radius: 8px;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);

        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        --transition: all 0.3s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Noto Sans Lao', 'Phetsarath OT', sans-serif;

    }
    .login-container {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 20px;
    }
    .login-box {
        background: var(--white); border-radius: 16px; box-shadow: var(--shadow-lg);
        width: 100%; max-width: 420px; padding: 40px;
        animation: slideUp 0.5s ease;
    }
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .login-header { text-align: center; margin-bottom: 32px; }
    .login-header .logo {
        width: 80px; height: 80px; background: var(--primary-light); border-radius: 50%;
        display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
    }
    .login-header .logo i { font-size: 36px; color: var(--primary); }
    .login-header h1 { font-size: 1.25rem; font-weight: 700; color: var(--gray-800); margin-bottom: 4px; }
    .login-header .subtitle { font-size: 0.875rem; color: var(--gray-500); }
    .login-form .form-group { margin-bottom: 20px; }
    .login-form label { display: block; font-weight: 500; margin-bottom: 6px; color: var(--gray-700); font-size: 0.875rem; }
    .login-form label i { margin-right: 6px; color: var(--primary); width: 16px; }
    .login-form input, .login-form select {
        width: 100%; padding: 12px 14px; border: 2px solid var(--gray-200); border-radius: var(--border-radius);
        font-family: inherit; font-size: 0.9375rem; transition: var(--transition); background: var(--white);
    }
    .login-form input:focus, .login-form select:focus {
        outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light);
    }
    .password-input { position: relative; }
    .password-input input { padding-right: 44px; }
    .toggle-password {
        position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
        background: none; border: none; color: var(--gray-400); cursor: pointer; font-size: 1rem;
    }
    .btn-login {
        width: 100%; padding: 14px; background: var(--primary); color: var(--white); border: none;
        border-radius: var(--border-radius); font-family: inherit; font-size: 1rem; font-weight: 600;
        cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .error-message { color: var(--danger); font-size: 0.875rem; margin-top: 12px; text-align: center; display: none; padding: 8px; background: var(--danger-light); border-radius: 6px; }
    .error-message.show { display: block; }
    .login-footer { margin-top: 24px; text-align: center; font-size: 0.75rem; color: var(--gray-400); }
    .app-container { display: flex; min-height: 100vh; }
    .sidebar {
        width: var(--sidebar-width); background: var(--white); border-right: 1px solid var(--gray-200);

    .logo-small { width: 36px; height: 36px; background: var(--primary-light); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-small i { color: var(--primary); font-size: 1.125rem; }

    .sidebar.collapsed .brand-name { display: none; }

        display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--border-radius);
        color: var(--gray-600); text-decoration: none; font-size: 0.9375rem; font-weight: 500; transition: var(--transition);

    .sidebar-nav a i { width: 20px; text-align: center; font-size: 1rem; }
    .sidebar-nav a:hover { background: var(--gray-100); color: var(--primary); }
    .sidebar-nav a.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .sidebar.collapsed .sidebar-nav a span { display: none; }
    .sidebar-footer { padding: 16px; border-top: 1px solid var(--gray-200); }

    .sidebar.collapsed + .main-content { margin-left: var(--sidebar-collapsed); }

    .page-title { margin-left: 16px; flex: 1; }

    .top-actions { display: flex; align-items: center; gap: 16px; }
    .notification-bell { position: relative; cursor: pointer; padding: 8px; border-radius: var(--border-radius); }
    .notification-bell:hover { background: var(--gray-100); }
    .notification-bell i { font-size: 1.125rem; color: var(--gray-600); }
    .badge {
        position: absolute; top: 4px; right: 4px; background: var(--danger); color: var(--white);

    }
    .current-time { font-size: 0.875rem; color: var(--gray-500); font-weight: 500; }
    .content-area { flex: 1; padding: 24px; overflow-y: auto; }
    .dashboard-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 24px; }
    .stat-card {
        background: var(--white); border-radius: 12px; padding: 20px; box-shadow: var(--shadow);
        transition: var(--transition); border-left: 4px solid var(--primary);
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .stat-card.success { border-left-color: var(--success); }
    .stat-card.warning { border-left-color: var(--warning); }
    .stat-card.info { border-left-color: var(--info); }
    .stat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .stat-label { font-size: 0.875rem; color: var(--gray-500); font-weight: 500; }
    .stat-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.125rem; }
    .stat-card .stat-icon { background: var(--primary-light); color: var(--primary); }
    .stat-card.success .stat-icon { background: var(--success-light); color: var(--success); }
    .stat-card.warning .stat-icon { background: var(--warning-light); color: var(--warning); }
    .stat-card.info .stat-icon { background: var(--info-light); color: var(--info); }
    .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--gray-800); margin-bottom: 4px; }
    .stat-change { font-size: 0.8125rem; color: var(--gray-500); }
    .data-table-container { background: var(--white); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
    .table-header { padding: 20px 24px; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .table-title { font-size: 1.125rem; font-weight: 600; color: var(--gray-800); }
    .table-actions { display: flex; gap: 8px; align-items: center; }
    .search-box { position: relative; }
    .search-box input { padding: 10px 14px 10px 38px; border: 2px solid var(--gray-200); border-radius: var(--border-radius); font-family: inherit; font-size: 0.875rem; width: 240px; transition: var(--transition); }
    .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400); }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { padding: 14px 24px; text-align: left; font-size: 0.875rem; }
    .data-table th { background: var(--gray-50); color: var(--gray-600); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; border-bottom: 2px solid var(--gray-200); }
    .data-table tbody tr { border-bottom: 1px solid var(--gray-100); transition: var(--transition); }
    .data-table tbody tr:hover { background: var(--gray-50); }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .status-pending { background: var(--warning-light); color: var(--warning); }
    .status-approved { background: var(--success-light); color: var(--success); }
    .status-rejected { background: var(--danger-light); color: var(--danger); }
    .status-progress { background: var(--info-light); color: var(--info); }
    .status-completed { background: var(--primary-light); color: var(--primary); }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: var(--border-radius); font-family: inherit; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: var(--transition); border: none; text-decoration: none; }
    .btn-primary { background: var(--primary); color: var(--white); }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn-success { background: var(--success); color: var(--white); }
    .btn-danger { background: var(--danger); color: var(--white); }
    .btn-secondary { background: var(--gray-200); color: var(--gray-700); }
    .btn-outline { background: transparent; border: 2px solid var(--gray-300); color: var(--gray-600); }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .btn-sm { padding: 6px 12px; font-size: 0.8125rem; }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 500; margin-bottom: 6px; color: var(--gray-700); font-size: 0.875rem; }
    .form-group label .required { color: var(--danger); margin-left: 2px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border: 2px solid var(--gray-200); border-radius: var(--border-radius); font-family: inherit; font-size: 0.9375rem; transition: var(--transition); background: var(--white); }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal.show { display: flex; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-content { background: var(--white); border-radius: 12px; box-shadow: var(--shadow-lg); width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease; }
    .modal-content.modal-lg { max-width: 700px; }
    .modal-content.modal-xl { max-width: 900px; }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; }
    .modal-header h3 { font-size: 1.125rem; font-weight: 600; color: var(--gray-800); display: flex; align-items: center; gap: 8px; }
    .close-btn { background: none; border: none; font-size: 1.5rem; color: var(--gray-400); cursor: pointer; line-height: 1; }
    .close-btn:hover { color: var(--danger); }
    .modal-body { padding: 24px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--gray-200); display: flex; gap: 12px; justify-content: flex-end; }
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--white); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 16px 20px; display: flex; align-items: center; gap: 12px; min-width: 300px; max-width: 400px; animation: slideInRight 0.3s ease; border-left: 4px solid var(--primary); }
    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast.warning { border-left-color: var(--warning); }
    .toast.info { border-left-color: var(--info); }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
    .toast-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .toast.success .toast-icon { background: var(--success-light); color: var(--success); }
    .toast.error .toast-icon { background: var(--danger-light); color: var(--danger); }
    .toast.warning .toast-icon { background: var(--warning-light); color: var(--warning); }
    .toast.info .toast-icon { background: var(--info-light); color: var(--info); }
    .toast-content { flex: 1; }
    .toast-title { font-weight: 600; font-size: 0.9375rem; color: var(--gray-800); margin-bottom: 2px; }
    .toast-message { font-size: 0.8125rem; color: var(--gray-500); }
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state-icon { width: 80px; height: 80px; background: var(--gray-100); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    .empty-state-icon i { font-size: 2rem; color: var(--gray-400); }
    .empty-state h3 { font-size: 1.125rem; color: var(--gray-700); margin-bottom: 8px; }
    .empty-state p { color: var(--gray-500); font-size: 0.875rem; }
    .job-card { background: var(--white); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 20px; }
    .job-card-header { padding: 20px 24px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: var(--white); }
    .job-card-header h3 { font-size: 1.125rem; font-weight: 600; margin-bottom: 4px; }
    .job-card-header .job-number { font-size: 0.875rem; opacity: 0.9; }
    .job-card-body { padding: 24px; }
    .job-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .job-info-item { padding: 12px; background: var(--gray-50); border-radius: var(--border-radius); }
    .job-info-item .label { font-size: 0.75rem; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .job-info-item .value { font-weight: 600; color: var(--gray-800); font-size: 0.9375rem; }
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .spinner { width: 48px; height: 48px; border: 4px solid var(--gray-200); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .parts-list { display: flex; flex-direction: column; gap: 12px; }
    .part-item { display: flex; align-items: center; gap: 16px; padding: 16px; background: var(--gray-50); border-radius: var(--border-radius); border: 1px solid var(--gray-200); }
    .part-item .part-image { width: 60px; height: 60px; background: var(--white); border-radius: var(--border-radius); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--gray-400); flex-shrink: 0; }
    .part-item .part-info { flex: 1; }
    .part-item .part-name { font-weight: 600; color: var(--gray-800); margin-bottom: 4px; }
    .part-item .part-code { font-size: 0.8125rem; color: var(--gray-500); font-family: monospace; }
    .part-item .part-price { font-weight: 700; color: var(--primary); font-size: 1rem; }
    .part-item .part-qty { display: flex; align-items: center; gap: 8px; }
    .part-item .qty-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--gray-300); background: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .part-item .qty-btn:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .part-item .qty-value { font-weight: 600; min-width: 30px; text-align: center; }
    .checklist-container { background: var(--white); border-radius: 12px; box-shadow: var(--shadow); padding: 24px; }
    .checklist-category { margin-bottom: 24px; }
    .checklist-category-title { font-size: 1rem; font-weight: 600; color: var(--gray-800); margin-bottom: 12px; padding: 8px 12px; background: var(--gray-100); border-radius: var(--border-radius); }
    .checklist-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid var(--gray-100); transition: var(--transition); }

    @media (max-width: 768px) {
        .sidebar { transform: translateX(-100%); }
        .sidebar.show { transform: translateX(0); }
        .main-content { margin-left: 0; }
        .dashboard-stats { grid-template-columns: 1fr; }
        .form-row { grid-template-columns: 1fr; }
        .data-table { display: block; overflow-x: auto; }
    }
    </style>

<body>
    <div id="login-page" class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo"><i class="fas fa-car-crash"></i></div>
                <h1>ລະບົບຈັດການສູນສ້ອມແປງຍານພາຫະນະ</h1>
                <p class="subtitle">Vehicle Repair Center Management System</p>
            </div>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> ອີເມວ</label>
                    <input type="email" id="email" name="email" placeholder="admin@example.com" required value="admin@example.com">
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> ລະຫັດຜ່ານ</label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" placeholder="123456" required value="123456">
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="role"><i class="fas fa-user-tag"></i> ຕຳແໜ່ງ</label>

    // ===================== UTILS =====================
    function formatCurrency(amount) {
        if (amount == null) return '0 ₭';
        return new Intl.NumberFormat('lo-LA', { style: 'currency', currency: 'LAK', maximumFractionDigits: 0 }).format(amount);
    }
    function formatDate(ds) { if (!ds) return '-'; return new Date(ds).toLocaleDateString('lo-LA', { year: 'numeric', month: 'short', day: 'numeric' }); }
    function formatDateTime(ds) { if (!ds) return '-'; return new Date(ds).toLocaleDateString('lo-LA', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
    function generateId(p) { p = p || ''; return (p + Date.now().toString(36) + Math.random().toString(36).substr(2, 5)).toUpperCase(); }
    function generateJobNumber() { const d = new Date(); const y = d.getFullYear().toString().substr(-2); const m = String(d.getMonth()+1).padStart(2,'0'); const day = String(d.getDate()).padStart(2,'0'); const r = Math.floor(Math.random()*9999).toString().padStart(4,'0'); return 'JC'+y+m+day+'-'+r; }
    function generatePartQRCode(pid, pcode) { return 'PART:'+pid+':'+pcode; }
    function calculateTotalCost(parts, labor) {
        let pt = 0, lt = 0;
        if (parts && parts.length) pt = parts.reduce((s,p) => s + ((p.parts ? p.parts.price : p.price || 0) * (p.quantity || 1)), 0);
        if (labor && labor.length) lt = labor.reduce((s,l) => s + (l.cost || 0), 0);
        return { partsTotal: pt, laborTotal: lt, grandTotal: pt + lt };
    }

        return c[s] || 'status-pending';

    function showToast(type, title, message, duration) {
        duration = duration || 3000;
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast ' + type;
        const icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-circle', info: 'fa-info-circle' };
        toast.innerHTML = '<div class="toast-icon"><i class="fas ' + icons[type] + '"></i></div><div class="toast-content"><div class="toast-title">' + title + '</div><div class="toast-message">' + message + '</div></div><button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>';
        container.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, duration);
    }

    function validateForm(fid) {
        const form = document.getElementById(fid); if (!form) return true;
        const fields = form.querySelectorAll('[required]'); let valid = true;
        fields.forEach(f => { if (!f.value.trim()) { valid = false; f.style.borderColor = 'var(--danger)'; } else { f.style.borderColor = ''; } });

    let currentUser = null;

    async function login(email, password, role) {
        try {
            showLoading();
            if (!email || !password || !role) { hideLoading(); return { success: false, error: 'ກະລຸນາປ້ອນຂໍ້ມູນໃຫ້ຄົບຖ້ວນ' }; }

            let staff = [];
            try { const r = await DB.getStaff(); staff = r.data || []; } catch(e) { console.warn('DB error, using demo'); }
            if (!staff.length) staff = MOCK_DATA.staff;

            const user = staff.find(s => s.email === email && s.role === role);
            if (!user) { hideLoading(); return { success: false, error: 'ບໍ່ພົບຜູ້ໃຊ້ ຫລື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ' }; }
            if (user.active === false) { hideLoading(); return { success: false, error: 'ບັນຊີນີ້ຖືກປິດການໃຊ້ງານ' }; }
            if (password !== '123456') { hideLoading(); return { success: false, error: 'ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ' }; }

            currentUser = { id: user.id, email: user.email, name: user.name, role: user.role, phone: user.phone };
            setCurrentUser(currentUser);
            hideLoading();
            showToast('success', 'ຍິນດີຕ້ອນຮັບ', 'ສະບາຍດີ, ' + user.name + '!');
            showMainApp();
            return { success: true, user: currentUser };
        } catch (error) {
            hideLoading();
            console.error('Login error:', error);
            return { success: false, error: error.message || 'ເກີດຂໍ້ຜິດພາດ' };
        }
    }

            const staff = r.data || [];
            const roleLabels = { reception: 'ຝ່າຍຕ້ອນຮັບ', mechanic: 'ຊ່າງສ້ອມແປງ', warehouse: 'ຝ່າຍສາງ', pdi: 'ຝ່າຍກວດກາ PDI', admin: 'ຜູ້ບໍລິຫານ' };
            const roleColors = { reception: 'var(--info)', mechanic: 'var(--warning)', warehouse: 'var(--success)', pdi: 'var(--primary)', admin: 'var(--danger)' };
            content.innerHTML = '<div class="data-table-container"><div class="table-header"><h3 class="table-title"><i class="fas fa-users-cog"></i> ລາຍຊື່ພະນັກງານ</h3><div class="table-actions"><div class="search-box"><i class="fas fa-search"></i><input type="text" placeholder="ຄົ້ນຫາ..." onkeyup="searchTable(this.value, 'staff-table')"></div><button class="btn btn-primary" onclick="showAddStaff()"><i class="fas fa-user-plus"></i> ເພີ່ມພະນັກງານ</button></div></div><div id="staff-table">' + renderStaffTable(staff, roleLabels, roleColors) + '</div></div>';
        } catch (e) { content.innerHTML = '<div class="empty-state"><h3>ເກີດຂໍ້ຜິດພາດ</h3></div>'; }
    }

    function renderStaffTable(staff, roleLabels, roleColors) {
        if (!staff || !staff.length) return '<div class="empty-state" style="padding:40px"><div class="empty-state-icon"><i class="fas fa-users"></i></div><h3>ບໍ່ມີຂໍ້ມູນພະນັກງານ</h3></div>';
        return '<table class="data-table"><thead><tr><th>ຊື່</th><th>ຕຳແໜ່ງ</th><th>ເບີໂທ</th><th>ອີເມວ</th><th>ຊ່ຽວຊານ</th><th>ສະຖານະ</th></tr></thead><tbody>' +
            staff.map(s => '<tr><td><div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;background:var(--primary-light);border-radius:50%;display:flex;align-items:center;justify-content:center"><i class="fas fa-user" style="color:var(--primary)"></i></div><strong>' + s.name + '</strong></div></td><td><span style="padding:4px 12px;border-radius:12px;font-size:0.75rem;font-weight:600;background:' + (roleColors[s.role] || 'var(--gray-200)') + '22;color:' + (roleColors[s.role] || 'var(--gray-600)') + ';">' + (roleLabels[s.role] || s.role) + '</span></td><td>' + (s.phone || '-') + '</td><td>' + (s.email || '-') + '</td><td>' + (s.specialty || '-') + '</td><td><span class="status-badge ' + (s.active !== false ? 'status-approved' : 'status-rejected') + '">' + (s.active !== false ? 'ເຮັດວຽກ' : 'ຢຸດເຮັດວຽກ') + '</span></td></tr>').join('') +
            '</tbody></table>';
    }

    function showAddStaff() { showToast('info', 'ກະລຸນາລໍຖ້າ', 'ຟອມເພີ່ມພະນັກງານກຳລັງພັດທະນາ'); }

    // ----- REPORTS -----
    async function loadReports() {
        document.getElementById('page-title').textContent = 'ລາຍງານ';
        const content = document.getElementById('content-area');
        const totalRevenue = 0; const completedJobs = 0; const avgJobValue = 0;
        const monthlyData = [
            { month: 'ມັງກອນ', jobs: 12, revenue: 2400000 }, { month: 'ກຸມພາ', jobs: 15, revenue: 3100000 },
            { month: 'ມີນາ', jobs: 18, revenue: 3800000 }, { month: 'ເມສາ', jobs: 14, revenue: 2900000 },
            { month: 'ພຶດສະພາ', jobs: 20, revenue: 4200000 }
        ];
        content.innerHTML = `
            <div class="dashboard-stats">
                <div class="stat-card success"><div class="stat-header"><span class="stat-label">ລາຍຮັບທັງໝົດ</span><div class="stat-icon"><i class="fas fa-money-bill-wave"></i></div></div><div class="stat-value">${formatCurrency(totalRevenue)}</div><div class="stat-change">ລວມທັງໝົດ</div></div>
                <div class="stat-card info"><div class="stat-header"><span class="stat-label">ງານສຳເລັດ</span><div class="stat-icon"><i class="fas fa-check-circle"></i></div></div><div class="stat-value">${completedJobs}</div><div class="stat-change">ຍານພາຫະນະ</div></div>
                <div class="stat-card warning"><div class="stat-header"><span class="stat-label">ມູນຄ່າເຉລີ່ຍ/ງານ</span><div class="stat-icon"><i class="fas fa-chart-line"></i></div></div><div class="stat-value">${formatCurrency(avgJobValue)}</div><div class="stat-change">ຕໍ່ໃບສັ່ງງານ</div></div>
                <div class="stat-card danger"><div class="stat-header"><span class="stat-label">ອາໄຫຼ່ໃກ້ຫມົດ</span><div class="stat-icon"><i class="fas fa-exclamation-triangle"></i></div></div><div class="stat-value">0</div><div class="stat-change">ລາຍການ</div></div>
            </div>
            <div class="data-table-container" style="margin-top:24px"><div class="table-header"><h3 class="table-title"><i class="fas fa-chart-bar"></i> ສະຫຼຸບລາຍເດືອນ</h3></div><table class="data-table"><thead><tr><th>ເດືອນ</th><th>ຈຳນວນງານ</th><th>ລາຍຮັບ</th><th>ມູນຄ່າເຉລີ່ຍ/ງານ</th></tr></thead><tbody>` +
            monthlyData.map(m => '<tr><td><strong>' + m.month + '</strong></td><td>' + m.jobs + ' ງານ</td><td>' + formatCurrency(m.revenue) + '</td><td>' + formatCurrency(m.revenue / m.jobs) + '</td></tr>').join('') +
            '</tbody></table></div>';
    }

    // ----- OTHER PAGES -----
    async function loadInvoices() { document.getElementById('page-title').textContent = 'ໃບເສັງລາຄາ'; document.getElementById('content-area').innerHTML = '<div class="empty-state" style="padding:40px"><div class="empty-state-icon"><i class="fas fa-file-invoice"></i></div><h3>ບໍ່ມີໃບເສັງລາຄາ</h3></div>'; }
    async function loadJobHistory() { document.getElementById('page-title').textContent = 'ປະຫວັດງານ'; document.getElementById('content-area').innerHTML = '<div class="empty-state" style="padding:40px"><div class="empty-state-icon"><i class="fas fa-history"></i></div><h3>ບໍ່ມີປະຫວັດງານ</h3></div>'; }
    async function loadCompletedPDI() { document.getElementById('page-title').textContent = 'ຍານພາຫະນະທີ່ກວດສຳເລັດ'; document.getElementById('content-area').innerHTML = '<div class="empty-state" style="padding:40px"><div class="empty-state-icon"><i class="fas fa-check-double"></i></div><h3>ບໍ່ມີງານທີ່ກວດສຳເລັດ</h3></div>'; }

    // ----- MODAL UTILS -----
    function closeModal(mid) {
        const modal = document.getElementById(mid);
        if (modal) { modal.classList.remove('show'); setTimeout(() => { if (modal.parentNode) modal.parentNode.removeChild(modal); }, 300); }
    }
    function searchTable(query, tableId) {
        const container = document.getElementById(tableId);
        if (!container) return;
        const rows = container.querySelectorAll('tbody tr');
        rows.forEach(row => { row.style.display = row.textContent.toLowerCase().includes(query.toLowerCase()) ? '' : 'none'; });
    }
    </script>
</body>
</html>
