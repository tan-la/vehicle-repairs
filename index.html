<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Repair Center Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --success: #059669;
            --success-light: #d1fae5;
            --warning: #d97706;
            --warning-light: #fef3c7;
            --danger: #dc2626;
            --danger-light: #fee2e2;
            --info: #0891b2;
            --info-light: #cffafe;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --white: #ffffff;
            --sidebar-width: 280px;
            --header-height: 60px;
            --border-radius: 8px;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Noto Sans Lao', sans-serif;
            background: var(--gray-100);
            color: var(--gray-800);
        }

        /* Login Page */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 20px;
        }

        .login-box {
            background: var(--white);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header { text-align: center; margin-bottom: 32px; }
        
        .login-header .logo {
            width: 80px;
            height: 80px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        
        .login-header .logo i { font-size: 36px; color: var(--primary); }
        .login-header h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
        .login-header .subtitle { font-size: 0.875rem; color: var(--gray-500); }

        .login-form .form-group { margin-bottom: 20px; }
        .login-form label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 0.875rem; color: var(--gray-700); }
        .login-form label i { margin-right: 6px; color: var(--primary); }
        
        .login-form input, .login-form select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--gray-200);
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.9375rem;
        }
        
        .login-form input:focus, .login-form select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-login:hover { background: var(--primary-dark); }

        .error-message {
            color: var(--danger);
            font-size: 0.875rem;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
        
        .error-message.show { display: block; }

        /* App Layout */
        .app-container { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: var(--sidebar-width);
            background: var(--white);
            border-right: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: all 0.3s ease;
        }
        
        .sidebar.collapsed { width: 70px; }
        
        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            gap: 12px;
            height: var(--header-height);
        }
        
        .logo-small {
            width: 36px;
            height: 36px;
            background: var(--primary-light);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-small i { color: var(--primary); font-size: 1.125rem; }
        .brand-name { font-weight: 700; font-size: 1.125rem; color: var(--gray-800); }
        .sidebar.collapsed .brand-name { display: none; }
        
        .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
        .sidebar-nav ul { list-style: none; }
        .sidebar-nav li { margin-bottom: 4px; }
        
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--border-radius);
            color: var(--gray-600);
            text-decoration: none;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
        }
        
        .sidebar-nav a:hover { background: var(--gray-100); color: var(--primary); }
        .sidebar-nav a.active { background: var(--primary-light); color: var(--primary); }
        .sidebar.collapsed .sidebar-nav a span { display: none; }
        
        .sidebar-footer { padding: 16px; border-top: 1px solid var(--gray-200); }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .user-avatar i { font-size: 1.25rem; color: var(--primary); }
        .user-name { font-weight: 600; font-size: 0.875rem; color: var(--gray-800); }
        .user-role { font-size: 0.75rem; color: var(--gray-500); }
        .sidebar.collapsed .user-details { display: none; }
        
        .btn-logout {
            width: 100%;
            padding: 10px;
            background: var(--danger-light);
            color: var(--danger);
            border: none;
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .btn-logout:hover { background: var(--danger); color: var(--white); }
        
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        
        .sidebar.collapsed + .main-content { margin-left: 70px; }
        
        .top-bar {
            height: var(--header-height);
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        
        .menu-toggle {
            background: none;
            border: none;
            color: var(--gray-600);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 8px;
            border-radius: var(--border-radius);
        }
        
        .page-title { margin-left: 16px; flex: 1; }
        .page-title h2 { font-size: 1.25rem; font-weight: 600; }
        
        .top-actions { display: flex; align-items: center; gap: 16px; }
        .notification-bell {
            position: relative;
            cursor: pointer;
        }
        .notification-bell .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
        }
        .current-time { font-size: 0.875rem; color: var(--gray-500); }
        
        .content-area { padding: 24px; }

        /* Dashboard Cards */
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: var(--white);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card.success { border-left-color: var(--success); }
        .stat-card.warning { border-left-color: var(--warning); }
        .stat-card.info { border-left-color: var(--info); }
        
        .stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .stat-label { font-size: 0.875rem; color: var(--gray-500); }
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-light);
            color: var(--primary);
        }
        .stat-value { font-size: 1.75rem; font-weight: 700; }

        /* Tables */
        .data-table-container {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        
        .table-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .table-title { font-size: 1.125rem; font-weight: 600; }
        .table-actions { display: flex; gap: 10px; }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .data-table th, .data-table td {
            padding: 12px 16px;
            text-align: left;
            font-size: 0.875rem;
            border-bottom: 1px solid var(--gray-200);
        }
        
        .data-table th {
            background: var(--gray-100);
            font-weight: 600;
            color: var(--gray-600);
        }
        .data-table tbody tr:hover { background: var(--gray-50); }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
        .status-pending { background: var(--warning-light); color: var(--warning); }
        .status-pending::before { background: var(--warning); }
        .status-approved { background: var(--success-light); color: var(--success); }
        .status-approved::before { background: var(--success); }
        .status-progress { background: var(--info-light); color: var(--info); }
        .status-progress::before { background: var(--info); }
        .status-completed { background: var(--primary-light); color: var(--primary); }
        .status-completed::before { background: var(--primary); }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--primary); color: var(--white); }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: var(--white); }
        .btn-success:hover { background: #047857; }
        .btn-warning { background: var(--warning); color: var(--white); }
        .btn-danger { background: var(--danger); color: var(--white); }
        .btn-secondary { background: var(--gray-300); color: var(--gray-700); }
        .btn-outline { background: transparent; border: 1px solid var(--gray-400); color: var(--gray-700); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .btn-sm { padding: 4px 12px; font-size: 0.75rem; }
        .btn-icon { padding: 8px; border-radius: 50%; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--white);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content.modal-lg { max-width: 900px; }
        .modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-header h3 { font-size: 1.125rem; font-weight: 600; }
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--gray-400);
            cursor: pointer;
        }
        .close-btn:hover { color: var(--danger); }
        .modal-body { padding: 24px; }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--gray-200);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* Forms */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 0.875rem; }
        .form-group .required { color: var(--danger); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-300);
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.875rem;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* Checklist for PDI */
        .checklist-container {
            max-height: 500px;
            overflow-y: auto;
        }
        .checklist-category {
            margin-bottom: 24px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            overflow: hidden;
        }
        .checklist-category-title {
            background: var(--gray-100);
            padding: 12px 16px;
            font-weight: 600;
        }
        .checklist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--gray-100);
        }
        .checklist-item:last-child { border-bottom: none; }
        .checklist-item.pass { background: var(--success-light); }
        .checklist-item.fail { background: var(--danger-light); }

        /* Parts Request */
        .parts-list { display: flex; flex-direction: column; gap: 12px; }
        .part-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            background: var(--gray-100);
            border-radius: 8px;
        }
        .part-item .part-info { flex: 1; }
        .part-item .part-name { font-weight: 600; }
        .part-item .part-code { font-size: 0.75rem; color: var(--gray-500); }
        .part-qty { display: flex; align-items: center; gap: 10px; }
        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--gray-300);
            background: white;
            cursor: pointer;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            animation: slideInRight 0.3s ease;
            border-left: 4px solid var(--primary);
        }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast.warning { border-left-color: var(--warning); }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .toast-icon { font-size: 1.25rem; }
        .toast.success .toast-icon { color: var(--success); }
        .toast.error .toast-icon { color: var(--danger); }
        .toast-content { flex: 1; }
        .toast-title { font-weight: 600; font-size: 0.875rem; }
        .toast-message { font-size: 0.75rem; color: var(--gray-500); }

        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state-icon {
            width: 80px;
            height: 80px;
            background: var(--gray-100);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .empty-state-icon i { font-size: 2rem; color: var(--gray-400); }
        .currency::after { content: ' ₭'; }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .loading-overlay.show { display: flex; }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--gray-300);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Search Box */
        .search-input {
            padding: 8px 12px;
            border: 1px solid var(--gray-300);
            border-radius: 20px;
            width: 250px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); position: fixed; }
            .sidebar.show { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .dashboard-stats { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .data-table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>
    <!-- LOGIN PAGE -->
    <div id="login-page" class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo"><i class="fas fa-car-crash"></i></div>
                <h1>ລະບົບຈັດການສູນສ້ອມແປງຍານພາຫະນະ</h1>
                <p class="subtitle">Vehicle Repair Center Management System</p>
            </div>
            <div class="login-form">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> ອີເມວ</label>
                    <input type="email" id="email" placeholder="somchai@test.com" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> ລະຫັດຜ່ານ</label>
                    <input type="password" id="password" placeholder="123456" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user-tag"></i> ຕຳແໜ່ງ</label>
                    <select id="role" required>
                        <option value="">ເລືອກຕຳແໜ່ງ</option>
                        <option value="reception">ຝ່າຍຕ້ອນຮັບ</option>
                        <option value="mechanic">ຊ່າງສ້ອມແປງ</option>
                        <option value="warehouse">ຝ່າຍສາງ</option>
                        <option value="pdi">ຝ່າຍກວດກາ PDI</option>
                        <option value="admin">ຜູ້ບໍລິຫານ</option>
                    </select>
                </div>
                <button id="login-btn" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> ເຂົ້າສູ່ລະບົບ
                </button>
                <div id="login-error" class="error-message"></div>
            </div>
            <div class="login-footer" style="text-align: center; margin-top: 24px; font-size: 0.75rem; color: var(--gray-400);">
                <p>Demo: somchai@test.com / 123456 / reception</p>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="app-container" style="display: none;">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-small"><i class="fas fa-car-crash"></i></div>
                <span class="brand-name">VRMS</span>
            </div>
            <nav class="sidebar-nav">
                <ul id="nav-menu"></ul>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
                    <div class="user-details">
                        <span id="user-name" class="user-name">User</span>
                        <span id="user-role" class="user-role">Role</span>
                    </div>
                </div>
                <button id="logout-btn" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button id="menu-toggle" class="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="page-title">
                    <h2 id="page-title">Dashboard</h2>
                </div>
                <div class="top-actions">
                    <div class="notification-bell" id="notification-bell">
                        <i class="fas fa-bell"></i>
                        <span id="notification-count" class="badge" style="display: none;">0</span>
                    </div>
                    <div class="current-time" id="current-time"></div>
                </div>
            </header>
            <div id="content-area" class="content-area">

        function generateJobNumber() {
            const d = new Date();
            const year = d.getFullYear().toString().slice(-2);
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const random = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
            return `JC${year}${month}${day}-${random}`;
        }

            async getParts() {

                const { data, error } = await initSupabase()
                    .from('notifications')
                    .select('*')
                    .eq('user_id', userId)

                    .order('created_at', { ascending: false });

            async savePDIResults(jobId, results, notes) {
                // First delete existing results for this job
                await initSupabase().from('pdi_checklists').delete().eq('job_card_id', jobId);
                
                // Insert new results
                const items = [];
                for (const [key, value] of Object.entries(results)) {
                    items.push({
                        job_card_id: jobId,
                        category: key.split('_')[0],
                        item_id: key,
                        item_name: key,
                        result: value ? 'pass' : 'fail',
                        checked_by: currentUser.id,
                        notes: notes
                    });
                }
                if (items.length > 0) {
                    const { data, error } = await initSupabase().from('pdi_checklists').insert(items).select();
                    return { data, error };
                }
                return { data: null, error: null };
            }
        };

        window.loadCustomerVehicles = async function(customerId) {
            if (!customerId) return;
            const { data: vehicles } = await DB.getVehiclesByCustomer(customerId);
            const select = document.getElementById('job_vehicle_id');
            select.innerHTML = '<option value="">ເລືອກຍານພາຫະນະ</option>';
            if (vehicles && vehicles.length > 0) {
                vehicles.forEach(v => {
                    select.innerHTML += `<option value="${v.id}">${v.brand} ${v.model} (${v.license_plate})</option>`;
                });
            } else {
                select.innerHTML += '<option value="" disabled>ບໍ່ມີຍານພາຫະນະ (ກະລຸນາເພີ່ມກ່ອນ)</option>';
            }
        };

        window.saveJobCard = async function() {
            const vehicleId = document.getElementById('job_vehicle_id')?.value;
            const mechanicId = document.getElementById('job_mechanic_id')?.value;
            const problem = document.getElementById('job_problem')?.value;
            
            if (!vehicleId) { showToast('warning', 'ແຈ້ງເຕືອນ', 'ກະລຸນາເລືອກຍານພາຫະນະ'); return; }
            if (!mechanicId) { showToast('warning', 'ແຈ້ງເຕືອນ', 'ກະລຸນາເລືອກຊ່າງ'); return; }
            if (!problem) { showToast('warning', 'ແຈ້ງເຕືອນ', 'ກະລຸນາປ້ອນບັນຫາທີ່ແຈ້ງ'); return; }
            
            showLoading();
            try {
                const jobCard = {
                    job_number: generateJobNumber(),
                    vehicle_id: vehicleId,
                    mechanic_id: mechanicId,
                    problem_description: problem,
                    mileage_in: parseInt(document.getElementById('job_mileage')?.value) || null,
                    notes: document.getElementById('job_notes')?.value || null,
                    status: 'assigned',
                    created_by: currentUser.id
                };
                
                const { data, error } = await DB.createJobCard(jobCard);
                if (error) throw error;
                
                await DB.createNotification({
                    user_id: mechanicId,
                    title: 'ມີງານໃໝ່',
                    message: `ທ່ານໄດ້ຮັບມອບໝາຍງານ ${data.job_number}`,
                    type: 'job_assigned'
                });
                
                hideLoading();
                document.querySelector('.modal.show')?.remove();
                showToast('success', 'ສຳເລັດ', `ເປີດໃບສັ່ງງານ ${data.job_number} ສຳເລັດ`);
                await loadJobCards();
            } catch (error) {
                hideLoading();
                showToast('error', 'ຜິດພາດ', error.message);
            }
        };

                            `<button class="btn btn-success" onclick="completeJob('${job.id}')">ສຳເລັດງານ</button>` : ''}
                        ${job.status === 'completed' && currentUser.role === 'pdi' ?
                            `<button class="btn btn-primary" onclick="startPDI('${job.id}')">ກວດກາ PDI</button>` : ''}
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.startJob = async function(jobId) {
            showLoading();
            try {
                await DB.updateJobCard(jobId, { status: 'in_progress', started_at: new Date().toISOString() });
                hideLoading();
                showToast('success', 'ສຳເລັດ', 'ເລີ່ມດຳເນີນງານແລ້ວ');
                document.querySelector('.modal.show')?.remove();
                await loadMyJobs();
            } catch (error) {
                hideLoading();
                showToast('error', 'ຜິດພາດ', error.message);
            }
        };

        window.completeJob = async function(jobId) {
            if (!confirm('ທ່ານແນ່ໃຈບໍ່ວ່າງານນີ້ສຳເລັດແລ້ວ? ຈະສົ່ງໄປກວດກາ PDI')) return;
            
            showLoading();
            try {
                await DB.updateJobCard(jobId, { status: 'completed', completed_at: new Date().toISOString() });
                hideLoading();
                showToast('success', 'ສຳເລັດ', 'ສົ່ງງານໄປກວດກາ PDI ແລ້ວ');
                document.querySelector('.modal.show')?.remove();
                await loadMyJobs();
            } catch (error) {
                hideLoading();
                showToast('error', 'ຜິດພາດ', error.message);
            }
        };

        window.startPDI = async function(jobId) {
            const { data: job } = await DB.getJobCardById(jobId);
            pdiResults = {};
            
            const modal = document.createElement('div');
            modal.className = 'modal show';
            modal.innerHTML = `
                <div class="modal-content modal-lg">
                    <div class="modal-header">
                        <h3><i class="fas fa-clipboard-check"></i> ກວດກາ PDI - ${job.job_number}</h3>
                        <button class="close-btn" onclick="this.closest('.modal').remove()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div style="padding: 12px; background: var(--info-light); border-radius: 8px; margin-bottom: 20px;">
                            <strong>${job.vehicles?.brand} ${job.vehicles?.model}</strong> | 
                            ${job.vehicles?.license_plate} | 
                            ລູກຄ້າ: ${job.vehicles?.customers?.name}
                        </div>
                        <div class="checklist-container">
                            ${PDI_CATEGORIES.map(cat => `
                                <div class="checklist-category">
                                    <div class="checklist-category-title">${cat.name}</div>
                                    ${cat.items.map(item => `
                                        <div class="checklist-item" id="pdi_${cat.id}_${item.replace(/ /g, '_')}">
                                            <span>${item}</span>
                                            <div>
                                                <button class="btn btn-sm btn-success" onclick="setPDIResult('${cat.id}_${item.replace(/ /g, '_')}', true)">ຜ່ານ</button>
                                                <button class="btn btn-sm btn-danger" onclick="setPDIResult('${cat.id}_${item.replace(/ /g, '_')}', false)">ບໍ່ຜ່ານ</button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            `).join('')}
                        </div>
                        <div class="form-group" style="margin-top: 20px;">
                            <label>ໝາຍເຫດ PDI</label>
                            <textarea id="pdi_notes" rows="2" placeholder="ໝາຍເຫດເພີ່ມເຕີມ..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="this.closest('.modal').remove()">ຍົກເລີກ</button>
                        <button class="btn btn-danger" onclick="submitPDI('${job.id}', false)">ບໍ່ຜ່ານ PDI</button>
                        <button class="btn btn-success" onclick="submitPDI('${job.id}', true)">ຜ່ານ PDI</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.setPDIResult = function(itemId, passed) {
            pdiResults[itemId] = passed;
            const element = document.getElementById(`pdi_${itemId}`);
            if (element) {
                element.classList.remove('pass', 'fail');
                element.classList.add(passed ? 'pass' : 'fail');
            }
        };

        window.submitPDI = async function(jobId, passed) {
            showLoading();
            try {
                const notes = document.getElementById('pdi_notes')?.value || '';
                await DB.savePDIResults(jobId, pdiResults, notes);
                const newStatus = passed ? 'pdi_passed' : 'pdi_failed';
                await DB.updateJobCard(jobId, { status: newStatus, pdi_completed_at: new Date().toISOString() });
                
                hideLoading();
                document.querySelector('.modal.show')?.remove();
                showToast('success', 'ສຳເລັດ', passed ? 'PDI ຜ່ານ! ຍານພາຫະນະພ້ອມສົ່ງມອບ' : 'PDI ບໍ່ຜ່ານ! ຕ້ອງກັບໄປແກ້ໄຂ');
                await loadPDI();
            } catch (error) {
                hideLoading();
                showToast('error', 'ຜິດພາດ', error.message);
            }
        };

        window.showAddCustomerModal = function() {
            const modal = document.createElement('div');
            modal.className = 'modal show';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h3><i class="fas fa-user-plus"></i> ເພີ່ມລູກຄ້າໃໝ່</h3>
                        <button class="close-btn" onclick="this.closest('.modal').remove()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group"><label>ຊື່ <span class="required">*</span></label><input type="text" id="cust_name" placeholder="ຊື່ ແລະ ນາມສະກຸນ"></div>
                        <div class="form-row">
                            <div class="form-group"><label>ເບີໂທ</label><input type="tel" id="cust_phone" placeholder="020XXXXXXXX"></div>
                            <div class="form-group"><label>ອີເມວ</label><input type="email" id="cust_email" placeholder="example@email.com"></div>
                        </div>
                        <div class="form-group"><label>ເລກປະຈຳຕົວ</label><input type="text" id="cust_id_card" placeholder="ເລກປະຈຳຕົວປະຊາຊົນ"></div>
                        <div class="form-group"><label>ທີ່ຢູ່</label><textarea id="cust_address" rows="2" placeholder="ບ້ານ, ເມືອງ, ແຂວງ..."></textarea></div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="this.closest('.modal').remove()">ຍົກເລີກ</button>
                        <button class="btn btn-primary" onclick="saveCustomer()">ບັນທຶກ</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.saveCustomer = async function() {
            const name = document.getElementById('cust_name')?.value;
            if (!name) { showToast('warning', 'ແຈ້ງເຕືອນ', 'ກະລຸນາປ້ອນຊື່ລູກຄ້າ'); return; }
            
            showLoading();
            try {
                const { data, error } = await DB.createCustomer({
                    name: name,
                    phone: document.getElementById('cust_phone')?.value,
                    email: document.getElementById('cust_email')?.value,
                    id_card: document.getElementById('cust_id_card')?.value,
                    address: document.getElementById('cust_address')?.value
                });
                if (error) throw error;
                
                hideLoading();
                document.querySelector('.modal.show')?.remove();
                showToast('success', 'ສຳເລັດ', 'ເພີ່ມລູກຄ້າສຳເລັດແລ້ວ');
                
                // Ask if user wants to add vehicle
                if (confirm('ຕ້ອງການເພີ່ມຍານພາຫະນະໃຫ້ລູກຄ້ານີ້ບໍ່?')) {
                    addVehicleToCustomer(data.id, name);
                }
                await loadCustomers();
            } catch (error) {
                hideLoading();
                showToast('error', 'ຜິດພາດ', error.message);
            }
        };

        window.addVehicleToCustomer = function(customerId, customerName) {
            const modal = document.createElement('div');
            modal.className = 'modal show';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h3><i class="fas fa-car-side"></i> ເພີ່ມຍານພາຫະນະໃຫ້ ${customerName}</h3>
                        <button class="close-btn" onclick="this.closest('.modal').remove()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="form-row">
                            <div class="form-group"><label>ປ້າຍທະບຽນ <span class="required">*</span></label><input type="text" id="vehicle_plate" placeholder="ກມ 1234"></div>
                            <div class="form-group"><label>ຍີ່ຫໍ້ <span class="required">*</span></label><input type="text" id="vehicle_brand" placeholder="Toyota / Honda / Ford"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>ຮຸ່ນ <span class="required">*</span></label><input type="text" id="vehicle_model" placeholder="Vios / CR-V / Ranger"></div>
                            <div class="form-group"><label>ປີຜະລິດ</label><input type="number" id="vehicle_year" placeholder="2024"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>ສີ</label><input type="text" id="vehicle_color" placeholder="ຂາວ / ດຳ / ເງິນ"></div>
                            <div class="form-group"><label>VIN</label><input type="text" id="vehicle_vin" placeholder="ເລກ VIN"></div>
                        </div>
                        <div class="form-group"><label>ເລກເຄື່ອງ</label><input type="text" id="vehicle_engine" placeholder="ເລກເຄື່ອງຈັກ"></div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="this.closest('.modal').remove()">ຍົກເລີກ</button>
                        <button class="btn btn-primary" onclick="saveVehicle('${customerId}')">ບັນທຶກຍານພາຫະນະ</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.saveVehicle = async function(customerId) {
            const plate = document.getElementById('vehicle_plate')?.value;
            const brand = document.getElementById('vehicle_brand')?.value;
            const model = document.getElementById('vehicle_model')?.value;
            
            if (!plate) { showToast('warning', 'ແຈ້ງເຕືອນ', 'ກະລຸນາປ້ອນປ້າຍທະບຽນ'); return; }
            if (!brand) { showToast('warning', 'ແຈ້ງເຕືອນ', 'ກະລຸນາປ້ອນຍີ່ຫໍ້ລົດ'); return; }
            if (!model) { showToast('warning', 'ແຈ້ງເຕືອນ', 'ກະລຸນາປ້ອນຮຸ່ນລົດ'); return; }
            
            showLoading();
            try {
                await DB.createVehicle({
                    customer_id: customerId,
                    license_plate: plate.toUpperCase(),
                    brand: brand,
                    model: model,
                    year: parseInt(document.getElementById('vehicle_year')?.value) || null,
                    color: document.getElementById('vehicle_color')?.value,
                    vin: document.getElementById('vehicle_vin')?.value,
                    engine_number: document.getElementById('vehicle_engine')?.value
                });
                
                hideLoading();
                document.querySelector('.modal.show')?.remove();
                showToast('success', 'ສຳເລັດ', 'ເພີ່ມຍານພາຫະນະສຳເລັດແລ້ວ');
                await loadVehicles();
                await loadCustomers();
            } catch (error) {
                hideLoading();
                showToast('error', 'ຜິດພາດ', error.message);
            }
        };

        window.showCustomerVehicles = async function(customerId, customerName) {
            const { data: vehicles } = await DB.getVehiclesByCustomer(customerId);
            const modal = document.createElement('div');
            modal.className = 'modal show';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h3><i class="fas fa-car"></i> ຍານພາຫະນະຂອງ ${customerName}</h3>
                        <button class="close-btn" onclick="this.closest('.modal').remove()">&times;</button>
                    </div>
                    <div class="modal-body">
                        ${vehicles && vehicles.length > 0 ? `
                            <table class="data-table">
                                <thead><tr><th>ປ້າຍທະບຽນ</th><th>ຍີ່ຫໍ້/ຮຸ່ນ</th><th>ສີ</th><th>ປີ</th><th>ຈັດການ</th></tr></thead>
                                <tbody>
                                    ${vehicles.map(v => `
                                        <tr>
                                            <td><strong>${v.license_plate}</strong></td>
                                            <td>${v.brand} ${v.model}</td>
                                            <td>${v.color || '-'}</td>
                                            <td>${v.year || '-'}</td>
                                            <td><button class="btn btn-primary btn-sm" onclick="createJobForVehicle('${v.id}')"><i class="fas fa-clipboard-list"></i> ເປີດງານ</button></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        ` : '<div class="empty-state">ບໍ່ມີຂໍ້ມູນຍານພາຫະນະ</div>'}
                        <div style="margin-top: 16px;">
                            <button class="btn btn-primary" onclick="this.closest('.modal').remove(); addVehicleToCustomer('${customerId}', '${customerName}')">
                                <i class="fas fa-plus"></i> ເພີ່ມຍານພາຫະນະ
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.createJobForVehicle = async function(vehicleId) {
            // Get vehicle info first
            const { data: vehicle } = await initSupabase().from('vehicles').select('*, customers(*)').eq('id', vehicleId).single();
            if (vehicle && vehicle.customers) {
                showCreateJobModal();
                setTimeout(async () => {
                    const customerSelect = document.getElementById('job_customer_id');
                    if (customerSelect) {
                        customerSelect.value = vehicle.customer_id;
                        await loadCustomerVehicles(vehicle.customer_id);
                        setTimeout(() => {
                            const vehicleSelect = document.getElementById('job_vehicle_id');
                            if (vehicleSelect) vehicleSelect.value = vehicleId;
                        }, 100);
                    }
                }, 100);
            } else {
                showCreateJobModal();
            }
        };

        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleDateString('lo-LA', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function showMainApp() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            document.getElementById('user-name').textContent = currentUser.name;
            document.getElementById('user-role').textContent = getRoleLabel(currentUser.role);
            buildNavigation(currentUser.role);
            loadDashboard();
            updateTime();
            setInterval(updateTime, 1000);
            setInterval(() => loadNotifications(), 30000); // Check notifications every 30 seconds
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            initSupabase();
            
            const savedUser = getCurrentUser();
            if (savedUser && savedUser.id) {
                currentUser = savedUser;
                showMainApp();
            }
            
            document.getElementById('login-btn').addEventListener('click', async () => {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const role = document.getElementById('role').value;
                const errorDiv = document.getElementById('login-error');
                
                if (!role) {
                    errorDiv.textContent = 'ກະລຸນາເລືອກຕຳແໜ່ງ';
                    errorDiv.classList.add('show');
                    return;
                }
                
                const success = await login(email, password, role);
                if (success) {
                    errorDiv.classList.remove('show');
                } else {
                    errorDiv.textContent = 'ອີເມວ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ';
                    errorDiv.classList.add('show');
                }
            });
            
            document.getElementById('logout-btn').addEventListener('click', logout);
            document.getElementById('menu-toggle').addEventListener('click', toggleSidebar);
            document.getElementById('notification-bell').addEventListener('click', async () => {
                const { data: notifications } = await DB.getUnreadNotifications(currentUser?.id);
                if (notifications && notifications.length > 0) {
                    let message = '';
                    notifications.forEach(n => {
                        message += `${n.title}: ${n.message}\n`;
                    });
                    alert(message);
                    for (const n of notifications) {
                        await DB.markNotificationRead(n.id);
                    }
                    await loadNotifications();
                } else {
                    showToast('info', 'ແຈ້ງເຕືອນ', 'ບໍ່ມີການແຈ້ງເຕືອນໃໝ່');
                }
            });
            
            // Enter key support
            ['email', 'password', 'role'].forEach(id => {
                document.getElementById(id).addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') document.getElementById('login-btn').click();
                });
            });
        });
    </script>
</body>
</html>
